<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iENCH // NODE 004</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #b8d3bf;
    font-family: "Courier New", monospace;
}

body {
    overflow: hidden;
}


/* =========================================================
   INTRO
========================================================= */

#intro {
    position: fixed;
    inset: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
    background: #000;

    z-index: 100;

    transition:
        opacity 2s ease,
        visibility 2s ease;
}

#intro.hide {
    opacity: 0;
    visibility: hidden;
}


/* =========================================================
   SYMBOLE
========================================================= */

.symbol {
    position: relative;

    width: 160px;
    height: 160px;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 35px;
}


/* cercle extérieur */

.symbol::before {
    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    border: 1px solid rgba(184,211,191,0.35);

    border-radius: 50%;

    animation:
        rotate 14s linear infinite;
}


/* cercle intérieur */

.symbol::after {
    content: "";

    position: absolute;

    width: 105px;
    height: 105px;

    border: 1px dashed rgba(184,211,191,0.35);

    border-radius: 50%;

    animation:
        rotateReverse 9s linear infinite;
}


/* logo */

.logo-image {
    position: relative;

    z-index: 2;

    width: 80px;
    height: 80px;

    object-fit: contain;

    opacity: .9;

    filter:
        brightness(.9)
        drop-shadow(0 0 15px rgba(184,211,191,.3));
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}

@keyframes rotateReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }

}

@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
        opacity: .55;
    }

    50% {
        transform: scale(1.08);
        opacity: 1;
    }

}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

@keyframes scan {

    0% {
        opacity: .3;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: .3;
    }

}


/* =========================================================
   LOGO INTRO
========================================================= */

.logo {
    font-family: "DejaVu Sans Light", monospace;

    font-size: 42px;

    font-weight: 400;

    letter-spacing: 0.25em;

    margin-left: 0.25em;

    color: #dce8df;

    opacity: 0;

    animation:
        appear 1s ease forwards;

    animation-delay: .5s;
}


.subtitle {

    margin-top: 12px;

    font-size: 11px;

    letter-spacing: 0.4em;

    color: #53665a;

    opacity: 0;

    animation:
        appear 2s ease forwards;

    animation-delay: 1.8s;
}


/* =========================================================
   TEXTE ETAT
========================================================= */

.status {

    margin-top: 55px;

    min-height: 18px;

    font-size: 12px;

    letter-spacing: 0.2em;

    color: #9eb5a4;
}


.info {

    margin-top: 12px;

    min-height: 16px;

    font-size: 10px;

    letter-spacing: 0.2em;

    color: #4e6255;
}


/* =========================================================
   BARRE INTRO
========================================================= */

.progress-wrapper {

    width: min(500px, 70vw);

    margin-top: 18px;
}


.progress {

    width: 100%;

    height: 3px;

    background: #101511;

    overflow: hidden;
}


.progress-fill {

    width: 0%;

    height: 100%;

    background: #b8d3bf;

    box-shadow:
        0 0 15px rgba(184,211,191,.7);

    transition: width .08s linear;
}


.percent {

    margin-top: 10px;

    font-size: 10px;

    color: #64776a;
}


/* =========================================================
   ARCHIVE
========================================================= */

#archive {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #000;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 2s ease,
        visibility 2s ease;

    z-index: 10;

    overflow-y: auto;

    padding: 40px 20px;
}


#archive.show {

    opacity: 1;

    visibility: visible;

}


/* =========================================================
   LECTEUR
========================================================= */

.player {

    width: min(850px, 90vw);

    text-align: center;

}


/* =========================================================
   LOGO DU LECTEUR
========================================================= */

.player-symbol {

    position: relative;

    width: 130px;
    height: 130px;

    margin: 0 auto 30px;

    display: flex;

    justify-content: center;

    align-items: center;
}


/* grand cercle */

.player-symbol::before {

    content: "";

    position: absolute;

    width: 120px;
    height: 120px;

    border:
        1px solid rgba(184,211,191,.35);

    border-radius: 50%;

    animation:
        rotate 14s linear infinite;
}


/* petit cercle */

.player-symbol::after {

    content: "";

    position: absolute;

    width: 82px;
    height: 82px;

    border:
        1px dashed rgba(184,211,191,.35);

    border-radius: 50%;

    animation:
        rotateReverse 9s linear infinite;
}


/* logo au centre */

.player-logo {

    position: relative;

    z-index: 2;

    width: 55px;
    height: 55px;

    object-fit: contain;

    opacity: .9;

    filter:
        brightness(.9)
        drop-shadow(0 0 15px rgba(184,211,191,.35));

    animation:
        pulse 3s ease-in-out infinite;
}


/* =========================================================
   TITRE
========================================================= */

.player-title {

    font-size: 14px;

    letter-spacing: 0.3em;

    color: #dce8df;

    margin-bottom: 8px;
}


.player-subtitle {

    font-size: 9px;

    letter-spacing: .25em;

    color: #4e6255;

    margin-bottom: 28px;
}


/* =========================================================
   PLAYER
========================================================= */

.audio-player {

    border:
        1px solid rgba(184,211,191,.2);

    padding: 25px;
}


/* =========================================================
   CONTROLES
========================================================= */

.controls {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 15px;

    margin-bottom: 25px;
}


.control-button {

    width: 45px;
    height: 45px;

    border:
        1px solid #53665a;

    background: transparent;

    color: #b8d3bf;

    font-family:
        "Courier New",
        monospace;

    cursor: pointer;

    font-size: 14px;

    transition:
        background .2s,
        color .2s,
        border .2s;
}


.control-button:hover {

    background: #b8d3bf;

    color: #000;

    border-color: #b8d3bf;
}


.play-button {

    width: 58px;
    height: 58px;

    font-size: 18px;
}


/* =========================================================
   PROGRESSION AUDIO
========================================================= */

.audio-progress {

    width: 100%;

    height: 3px;

    background: #151c17;

    cursor: pointer;

    position: relative;
}


.audio-progress-fill {

    width: 0%;

    height: 100%;

    background: #b8d3bf;

    box-shadow:
        0 0 10px rgba(184,211,191,.5);
}


/* =========================================================
   TEMPS
========================================================= */

.time {

    display: flex;

    justify-content: space-between;

    margin-top: 9px;

    font-size: 9px;

    color: #53665a;
}


/* =========================================================
   LISTE
========================================================= */

.track-list {

    margin-top: 30px;

    border-top:
        1px solid rgba(184,211,191,.12);
}


.track {

    display: flex;

    align-items: center;

    padding: 13px 10px;

    border-bottom:
        1px solid rgba(184,211,191,.08);

    cursor: pointer;

    transition:
        background .2s,
        padding-left .2s;
}


.track:hover {

    background:
        rgba(184,211,191,.05);

    padding-left: 15px;
}


.track-number {

    width: 35px;

    text-align: left;

    font-size: 9px;

    color: #53665a;
}


.track-name {

    flex: 1;

    text-align: left;

    font-size: 10px;

    letter-spacing: .18em;

    color: #82998a;
}


.track.active {

    background:
        rgba(184,211,191,.07);
}


.track.active .track-name {

    color: #dce8df;

}


.track.active .track-number {

    color: #b8d3bf;
}


.track-playing {

    width: 25px;

    text-align: right;

    font-size: 9px;

    color: #b8d3bf;
}


/* =========================================================
   INFO
========================================================= */

.player-info {

    margin-top: 20px;

    font-size: 9px;

    letter-spacing: .2em;

    color: #4e6255;

    line-height: 1.8;
}


/* =========================================================
   GLYPHES
========================================================= */

.glyph {

    position: fixed;

    color: #29382e;

    font-size: 14px;

    opacity: .35;

    animation:
        float 5s ease-in-out infinite alternate;

    pointer-events: none;
}


.g1 {
    top: 15%;
    left: 18%;
}

.g2 {
    top: 30%;
    right: 17%;
}

.g3 {
    bottom: 20%;
    left: 20%;
}

.g4 {
    bottom: 17%;
    right: 22%;
}


@keyframes float {

    from {
        transform:
            translateY(-8px)
            rotate(-3deg);
    }

    to {
        transform:
            translateY(8px)
            rotate(3deg);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .player {
        width: 95vw;
    }

    .player-symbol {
        width: 105px;
        height: 105px;
    }

    .player-symbol::before {
        width: 100px;
        height: 100px;
    }

    .player-symbol::after {
        width: 70px;
        height: 70px;
    }

    .player-logo {
        width: 45px;
        height: 45px;
    }

    .audio-player {
        padding: 18px;
    }

    .player-title {
        font-size: 11px;
        letter-spacing: .2em;
    }

    .track-name {
        font-size: 9px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     GLYPHES
===================================================== -->

<div class="glyph g1">𐌗</div>
<div class="glyph g2">◉</div>
<div class="glyph g3">⋔</div>
<div class="glyph g4">⟟</div>


<!-- =====================================================
     INTRO
===================================================== -->

<section id="intro">

    <div class="symbol">

        <img
            src="ienchlogo.jpg"
            class="logo-image"
            alt="iENCH"
        >

    </div>


    <div class="logo">
        iENCH
    </div>


    <div class="subtitle">
        ARCHIVE NODE 004
    </div>


    <div
        id="status"
        class="status">
        INITIALIZING
    </div>


    <div
        id="info"
        class="info">
        SEARCHING FOR SIGNAL
    </div>


    <div class="progress-wrapper">

        <div class="progress">

            <div
                id="progressFill"
                class="progress-fill">
            </div>

        </div>

        <div
            id="percent"
            class="percent">
            0%
        </div>

    </div>

</section>


<!-- =====================================================
     ARCHIVE
===================================================== -->

<section id="archive">

    <div class="player">


        <!-- LOGO ANIMÉ -->

        <div class="player-symbol">

            <img
                src="ienchlogo.jpg"
                class="player-logo"
                alt="iENCH"
            >

        </div>


        <div
            id="playerTitle"
            class="player-title">

            OMEN NOMENSEYA TOLL

        </div>


        <div class="player-subtitle">

            SIGNAL RESTORED // ARCHIVE NODE 004

        </div>


        <!-- =================================================
             PLAYER
        ================================================= -->

        <div class="audio-player">


            <div class="controls">

                <button
                    id="previousButton"
                    class="control-button"
                    title="Previous">
                    |◀
                </button>


                <button
                    id="playButton"
                    class="control-button play-button"
                    title="Play">
                    ▶
                </button>


                <button
                    id="nextButton"
                    class="control-button"
                    title="Next">
                    ▶|
                </button>

            </div>


            <!-- PROGRESSION -->

            <div
                id="audioProgress"
                class="audio-progress">

                <div
                    id="audioProgressFill"
                    class="audio-progress-fill">
                </div>

            </div>


            <div class="time">

                <span id="currentTime">
                    00:00
                </span>

                <span id="duration">
                    00:00
                </span>

            </div>


            <!-- LISTE DES TITRES -->

            <div
                id="trackList"
                class="track-list">
            </div>


            <div class="player-info">

                NODE 004 //
                ARCHIVE AVAILABLE //
                ORIGIN UNKNOWN

            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     AUDIO
===================================================== -->

<audio
    id="audio"
    preload="metadata">
</audio>


<script>


/* =========================================================
   INTRO
========================================================= */

const progressFill =
    document.getElementById("progressFill");

const percent =
    document.getElementById("percent");

const status =
    document.getElementById("status");

const info =
    document.getElementById("info");

const intro =
    document.getElementById("intro");

const archive =
    document.getElementById("archive");


const stages = [

    {
        at: 0,
        status: "INITIALIZING",
        info: "SEARCHING FOR SIGNAL"
    },

    {
        at: 10,
        status: "SCANNING",
        info: "NOISE DETECTED"
    },

    {
        at: 22,
        status: "SIGNAL FOUND",
        info: "UNKNOWN SOURCE"
    },

    {
        at: 35,
        status: "CONNECTING",
        info: "NODE 004"
    },

    {
        at: 48,
        status: "RECONSTRUCTING",
        info: "FRAGMENT 01 FOUND"
    },

    {
        at: 61,
        status: "DECODING",
        info: "LANGUAGE UNKNOWN"
    },

    {
        at: 74,
        status: "RESTORING",
        info: "MEMORY STRUCTURE STABLE"
    },

    {
        at: 87,
        status: "VERIFYING SIGNAL",
        info: "INTEGRITY 92.4%"
    },

    {
        at: 100,
        status: "SIGNAL RESTORED",
        info: "ARCHIVE AVAILABLE"
    }

];


let progress = 0;


function updateSequence() {

    progress +=
        Math.random() * 1.4 + 0.4;


    if (progress > 100) {
        progress = 100;
    }


    progressFill.style.width =
        progress + "%";


    percent.textContent =
        Math.floor(progress) + "%";


    let currentStage =
        stages[0];


    for (
        let i = 0;
        i < stages.length;
        i++
    ) {

        if (
            progress >=
            stages[i].at
        ) {

            currentStage =
                stages[i];

        }

    }


    status.textContent =
        currentStage.status;


    info.textContent =
        currentStage.info;


    if (progress >= 100) {

        setTimeout(() => {

            intro.classList.add("hide");


            setTimeout(() => {

                archive.classList.add("show");

                document.body.style.overflow =
                    "auto";

            }, 1800);

        }, 1000);

        return;

    }


    setTimeout(
        updateSequence,
        70 + Math.random() * 110
    );

}


setTimeout(
    updateSequence,
    1500
);


/* =========================================================
   PLAYLIST
========================================================= */


/*
 IMPORTANT :

 Les noms après "audio/" doivent correspondre
 EXACTEMENT aux noms de tes MP3 sur GitHub.
*/


const tracks = [

    {
        title: "OMEN NOMENSEYA TOLL",
        file: "audio/omen-nomenseya-toll.mp3"
    },

    {
        title: "CHAOS IN THE REVERIE",
        file: "audio/chaos-in-the-reverie.mp3"
    },

    {
        title: "YOHOL",
        file: "audio/yohol.mp3"
    },

    {
        title: "DISHUAL",
        file: "audio/dishual.mp3"
    },

    {
        title: "ALL OF YOU",
        file: "audio/all-of-you.mp3"
    },

    {
        title: "BLOOD FLOWER",
        file: "audio/blood-flower.mp3"
    }

    /*
       Ajoute ici les autres titres.

       Exemple :

       ,{
           title: "AUTRE TITRE",
           file: "audio/autre-titre.mp3"
       }

    */

];


/* =========================================================
   ELEMENTS PLAYER
========================================================= */

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("playButton");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

const audioProgress =
    document.getElementById("audioProgress");

const audioProgressFill =
    document.getElementById("audioProgressFill");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const playerTitle =
    document.getElementById("playerTitle");

const trackList =
    document.getElementById("trackList");


let currentTrack = 0;


/* =========================================================
   AFFICHER LA PLAYLIST
========================================================= */

function createTrackList() {

    trackList.innerHTML = "";


    tracks.forEach(
        (track, index) => {

            const element =
                document.createElement("div");


            element.className =
                "track";


            element.dataset.index =
                index;


            element.innerHTML = `

                <div class="track-number">
                    ${String(index + 1).padStart(2, "0")}
                </div>

                <div class="track-name">
                    ${track.title}
                </div>

                <div class="track-playing">
                    ${index === currentTrack ? "●" : ""}
                </div>

            `;


            element.addEventListener(
                "click",
                () => {

                    loadTrack(index);

                    playAudio();

                }
            );


            trackList.appendChild(element);

        }
    );

}


/* =========================================================
   CHARGER UN TITRE
========================================================= */

function loadTrack(index) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {

        return;

    }


    currentTrack =
        index;


    audio.src =
        tracks[currentTrack].file;


    playerTitle.textContent =
        tracks[currentTrack].title;


    audio.load();


    updateTrackList();

}


/* =========================================================
   PLAY
========================================================= */

function playAudio() {

    audio.play()
        .then(() => {

            playButton.textContent =
                "❚❚";

        })
        .catch(error => {

            console.log(
                "Impossible de lire le fichier audio :",
                error
            );

        });

}


/* =========================================================
   PAUSE
========================================================= */

function pauseAudio() {

    audio.pause();

    playButton.textContent =
        "▶";

}


/* =========================================================
   BOUTON PLAY
========================================================= */

playButton.addEventListener(
    "click",
    () => {

        if (audio.paused) {

            playAudio();

        } else {

            pauseAudio();

        }

    }
);


/* =========================================================
   PREVIOUS
========================================================= */

previousButton.addEventListener(
    "click",
    () => {

        if (
            audio.currentTime > 3
        ) {

            audio.currentTime = 0;

            return;

        }


        currentTrack--;


        if (
            currentTrack < 0
        ) {

            currentTrack =
                tracks.length - 1;

        }


        loadTrack(currentTrack);

        playAudio();

    }
);


/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(
    "click",
    () => {

        currentTrack++;


        if (
            currentTrack >= tracks.length
        ) {

            currentTrack = 0;

        }


        loadTrack(currentTrack);

        playAudio();

    }
);


/* =========================================================
   TITRE SUIVANT AUTOMATIQUE
========================================================= */

audio.addEventListener(
    "ended",
    () => {

        currentTrack++;


        if (
            currentTrack >= tracks.length
        ) {

            currentTrack = 0;

        }


        loadTrack(currentTrack);

        playAudio();

    }
);


/* =========================================================
   PROGRESSION
========================================================= */

audio.addEventListener(
    "timeupdate",
    () => {

        if (
            !audio.duration
        ) {

            return;

        }


        const percentage =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        audioProgressFill.style.width =
            percentage + "%";


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================================================
   DUREE
========================================================= */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =========================================================
   CLIC SUR BARRE
========================================================= */

audioProgress.addEventListener(
    "click",
    (event) => {

        if (
            !audio.duration
        ) {

            return;

        }


        const rect =
            audioProgress.getBoundingClientRect();


        const clickPosition =
            event.clientX -
            rect.left;


        const percentage =
            clickPosition /
            rect.width;


        audio.currentTime =
            percentage *
            audio.duration;

    }
);


/* =========================================================
   FORMAT TEMPS
========================================================= */

function formatTime(seconds) {

    if (
        isNaN(seconds)
    ) {

        return "00:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(secs).padStart(2, "0")
    );

}


/* =========================================================
   MISE A JOUR LISTE
========================================================= */

function updateTrackList() {

    const elements =
        document.querySelectorAll(".track");


    elements.forEach(
        (element, index) => {

            if (
                index === currentTrack
            ) {

                element.classList.add(
                    "active"
                );

                element.querySelector(
                    ".track-playing"
                ).textContent = "●";

            } else {

                element.classList.remove(
                    "active"
                );

                element.querySelector(
                    ".track-playing"
                ).textContent = "";

            }

        }
    );

}


/* =========================================================
   INITIALISATION
========================================================= */

createTrackList();

loadTrack(0);


</script>

</body>
</html>
