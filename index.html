<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iENCH // NODE 004</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#b8d3bf;
    font-family:"Courier New",monospace;
}

body{overflow:hidden}

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:#000;
    z-index:100;
    transition:opacity 2s ease,visibility 2s ease;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
}

/* ================= iENCH LOGO ANIMATION ================= */

.symbol,
.player-symbol{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.symbol{
    width:360px;
    height:360px;
    margin-bottom:35px;
    isolation:isolate;
    overflow:visible;
}

.symbol::before{
    content:"";
    position:absolute;
    inset:-55px;
    z-index:0;
    border-radius:50%;
    background:
        radial-gradient(
            ellipse at 30% 38%,
            rgba(255,72,0,.42) 0%,
            transparent 35%
        ),
        radial-gradient(
            ellipse at 72% 62%,
            rgba(255,120,0,.30) 0%,
            transparent 38%
        ),
        radial-gradient(
            ellipse at 48% 82%,
            rgba(155,25,0,.38) 0%,
            transparent 42%
        );
    filter:blur(28px);
    opacity:.75;
    animation:smokeDrift 18s ease-in-out infinite alternate;
    pointer-events:none;
}

.symbol::after{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    z-index:4;
    border-radius:50%;
    background:
        conic-gradient(
            from 0deg,
            transparent 0deg,
            transparent 24deg,
            rgba(255,91,0,.95) 42deg,
            rgba(255,190,30,1) 53deg,
            rgba(255,91,0,.45) 67deg,
            transparent 92deg,
            transparent 155deg,
            rgba(255,110,0,.85) 174deg,
            rgba(255,180,30,.95) 188deg,
            transparent 207deg,
            transparent 285deg,
            rgba(255,70,0,.75) 302deg,
            rgba(255,170,20,1) 315deg,
            transparent 337deg
        );
    -webkit-mask:
        radial-gradient(
            farthest-side,
            transparent calc(100% - 2px),
            #000 calc(100% - 2px)
        );
    mask:
        radial-gradient(
            farthest-side,
            transparent calc(100% - 2px),
            #000 calc(100% - 2px)
        );
    filter:
        drop-shadow(0 0 5px rgba(255,91,0,.9))
        drop-shadow(0 0 18px rgba(255,70,0,.45));
    animation:
        ringRotate 14s linear infinite,
        ringPulse 3.8s ease-in-out infinite;
    pointer-events:none;
}

.logo-image{
    position:absolute;
    z-index:2;
    width:455px;
    height:455px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    object-fit:cover;
    object-position:50% 42%;
    clip-path:circle(47% at 50% 50%);
    opacity:.96;
    mix-blend-mode:screen;
    filter:
        brightness(1.08)
        contrast(1.08)
        drop-shadow(0 0 8px rgba(255,95,0,.85))
        drop-shadow(0 0 25px rgba(255,65,0,.42));
    animation:
        logoBreath 7s ease-in-out infinite,
        logoFlicker 5.5s ease-in-out infinite;
}

.symbol .smoke-layer{
    position:absolute;
    inset:-35px;
    z-index:3;
    border-radius:50%;
    background:
        radial-gradient(
            ellipse at 18% 58%,
            rgba(255,80,0,.18),
            transparent 32%
        ),
        radial-gradient(
            ellipse at 82% 42%,
            rgba(255,130,0,.15),
            transparent 34%
        ),
        radial-gradient(
            ellipse at 50% 10%,
            rgba(180,30,0,.12),
            transparent 35%
        );
    filter:blur(20px);
    mix-blend-mode:screen;
    pointer-events:none;
    animation:smokePass 22s ease-in-out infinite alternate;
}

.logo{
    font-family:"DejaVu Sans Light",monospace;
    font-size:42px;
    font-weight:400;
    letter-spacing:.25em;
    margin-left:.25em;
    color:#dce8df;
    opacity:0;
    animation:appear 1s ease forwards;
    animation-delay:.5s;
}

.subtitle{
    margin-top:12px;
    font-size:11px;
    letter-spacing:.4em;
    color:#53665a;
    opacity:0;
    animation:appear 2s ease forwards;
    animation-delay:1.8s;
}

.status{
    margin-top:55px;
    min-height:18px;
    font-size:12px;
    letter-spacing:.2em;
    color:#9eb5a4;
}

.info{
    margin-top:12px;
    min-height:16px;
    font-size:10px;
    letter-spacing:.2em;
    color:#4e6255;
}

.progress-wrapper{
    width:min(500px,70vw);
    margin-top:18px;
}

.progress{
    width:100%;
    height:3px;
    background:#101511;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#b8d3bf;
    box-shadow:0 0 15px rgba(184,211,191,.7);
    transition:width .08s linear;
}

.percent{
    margin-top:10px;
    font-size:10px;
    color:#64776a;
}


/* ================= FULL SCREEN LOGO BACKGROUND ================= */

#archive::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    background:
        radial-gradient(
            circle at center,
            rgba(0,0,0,.05) 0%,
            rgba(0,0,0,.56) 58%,
            rgba(0,0,0,.84) 100%
        ),
        linear-gradient(
            rgba(0,0,0,.20),
            rgba(0,0,0,.42)
        );
    pointer-events:none;
}

.archive-background-logo{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    object-position:center center;
    z-index:0;
    opacity:.78;
    filter:
        brightness(.72)
        contrast(1.12)
        saturate(1.08)
        drop-shadow(0 0 25px rgba(255,80,0,.35));
    transform:scale(1.015);
    animation:
        backgroundLogoBreath 12s ease-in-out infinite,
        backgroundLogoFlicker 7s ease-in-out infinite;
    pointer-events:none;
}

.logo-background-glow{
    position:fixed;
    left:50%;
    top:50%;
    width:min(92vw,1100px);
    height:min(92vw,1100px);
    transform:translate(-50%,-50%);
    z-index:1;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            transparent 48%,
            rgba(255,70,0,.08) 57%,
            rgba(255,100,0,.18) 61%,
            rgba(255,70,0,.04) 70%,
            transparent 76%
        );
    filter:blur(8px);
    animation:backgroundHalo 8s ease-in-out infinite;
    pointer-events:none;
}

.archive-vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,.06) 0%,
            rgba(0,0,0,.18) 38%,
            rgba(0,0,0,.70) 100%
        );
}


/* ================= DIAPORAMA ================= */

.archive-slideshow{
    position:fixed;
    inset:0;
    z-index:3;
    overflow:hidden;
    pointer-events:none;
    opacity:.34;
    mix-blend-mode:screen;
}

.slide-photo{
    position:absolute;
    width:clamp(220px,26vw,430px);
    height:clamp(160px,20vw,320px);
    object-fit:cover;
    opacity:0;
    border:1px solid rgba(255,120,40,.16);
    box-shadow:0 0 35px rgba(0,0,0,.7);
    filter:
        saturate(.55)
        contrast(1.08)
        brightness(.45);
    transition:
        opacity 2.8s ease,
        transform 10s cubic-bezier(.2,.7,.2,1),
        filter 2.4s ease;
}

.slide-photo.visible{
    opacity:.34;
    filter:
        saturate(.62)
        contrast(1.08)
        brightness(.50);
}

.slide-photo.s1{
    left:1%;
    top:6%;
    transform:rotate(-8deg) scale(1.02);
}

.slide-photo.s2{
    right:1%;
    top:5%;
    transform:rotate(7deg) scale(.98);
}

.slide-photo.s3{
    left:5%;
    bottom:5%;
    transform:rotate(5deg) scale(.95);
}

.slide-photo.s4{
    right:5%;
    bottom:4%;
    transform:rotate(-7deg) scale(1.02);
}

.slide-photo.s5{
    left:24%;
    top:1%;
    transform:rotate(-3deg) scale(.75);
}

.slide-photo.s6{
    right:24%;
    bottom:0%;
    transform:rotate(4deg) scale(.78);
}

.slide-photo.s7{
    left:10%;
    top:35%;
    transform:rotate(-11deg) scale(.68);
}

.slide-photo.s8{
    right:10%;
    top:33%;
    transform:rotate(10deg) scale(.68);
}

.slide-photo.visible.s1{
    transform:rotate(-5deg) scale(1.10) translate(24px,-10px);
}

.slide-photo.visible.s2{
    transform:rotate(4deg) scale(1.06) translate(-22px,14px);
}

.slide-photo.visible.s3{
    transform:rotate(3deg) scale(1.03) translate(-15px,-18px);
}

.slide-photo.visible.s4{
    transform:rotate(-4deg) scale(1.10) translate(18px,12px);
}

.slide-photo.visible.s5{
    transform:rotate(2deg) scale(.88) translate(-18px,12px);
}

.slide-photo.visible.s6{
    transform:rotate(-2deg) scale(.91) translate(16px,-10px);
}

.slide-photo.visible.s7{
    transform:rotate(-7deg) scale(.80) translate(-10px,14px);
}

.slide-photo.visible.s8{
    transform:rotate(7deg) scale(.80) translate(12px,-12px);
}

.slideshow-noise{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(
            rgba(255,255,255,.07) .6px,
            transparent .6px
        );
    background-size:4px 4px;
    opacity:.055;
    mix-blend-mode:screen;
}


/* ================= ARCHIVE ================= */

#archive .player{
    position:relative;
    z-index:20;
}

#archive .player::before{
    content:"";
    position:absolute;
    inset:-100px -140px;
    z-index:-1;
    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,.94) 0%,
            rgba(0,0,0,.82) 38%,
            rgba(0,0,0,.48) 64%,
            transparent 82%
        );
    pointer-events:none;
}

#archive{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(91,24,4,.16),
            transparent 34%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(35,7,1,.35),
            transparent 66%
        ),
        #010101;
    opacity:0;
    visibility:hidden;
    transition:
        opacity 1.8s ease,
        visibility 1.8s ease;
    z-index:10;
    overflow:hidden;
}

#archive.show{
    opacity:1;
    visibility:visible;
}

.archive-background-logo{
    position:absolute;
    left:50%;
    top:50%;
    width:min(1200px,100vw);
    height:min(1200px,100vw);
    transform:translate(-50%,-50%);
    object-fit:cover;
    object-position:center;
    opacity:.035;
    filter:sepia(1) saturate(2) blur(1px);
    pointer-events:none;
    mix-blend-mode:screen;
}

.logo-background-glow{
    position:absolute;
    inset:10%;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,80,0,.11),
            transparent 43%
        ),
        radial-gradient(
            circle,
            rgba(196,69,8,.07),
            transparent 65%
        );
    filter:blur(35px);
    animation:referenceBreath 8s ease-in-out infinite;
    pointer-events:none;
}

.archive-vignette{
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle,
            transparent 35%,
            rgba(0,0,0,.28) 68%,
            rgba(0,0,0,.82) 100%
        ),
        repeating-radial-gradient(
            circle at 50% 50%,
            transparent 0 76px,
            rgba(255,82,12,.025) 77px 78px
        );
    pointer-events:none;
}


/* ================= PLAYER ================= */

.player{
    position:relative;
    width:min(1280px,100vw);
    height:min(960px,100vh);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
}

.radial-player{
    position:relative;
    width:min(900px,92vh,88vw);
    height:min(900px,92vh,88vw);
    min-width:660px;
    min-height:660px;
    isolation:isolate;
}

.radial-player::before{
    content:"";
    position:absolute;
    inset:3%;
    border-radius:50%;
    border:1px solid rgba(225,91,17,.20);
    box-shadow:
        0 0 25px rgba(255,65,0,.10),
        inset 0 0 55px rgba(255,67,0,.08);
    pointer-events:none;
}

.radial-player::after{
    content:"";
    position:absolute;
    inset:-3%;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            transparent 49%,
            rgba(255,91,14,.055) 49.3%,
            transparent 50%
        ),
        radial-gradient(
            circle,
            transparent 62%,
            rgba(255,110,25,.045) 62.2%,
            transparent 62.7%
        ),
        radial-gradient(
            circle,
            transparent 76%,
            rgba(205,65,9,.035) 76.2%,
            transparent 76.8%
        );
    pointer-events:none;
}


/* ================= RADIAL RINGS ================= */

.radial-rings{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.radial-ring{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
}

.r1{
    width:39%;
    height:39%;
    border:1px solid rgba(255,123,27,.66);
    box-shadow:
        0 0 16px rgba(255,78,0,.26),
        inset 0 0 18px rgba(255,70,0,.08);
}

.r2{
    width:46%;
    height:46%;
    border:1px solid rgba(255,164,61,.50);
    border-top-color:#ffb84f;
    border-right-color:rgba(255,83,8,.18);
    animation:ringRotate 28s linear infinite;
}

.r3{
    width:53%;
    height:53%;
    border:1px dashed rgba(224,94,14,.47);
    animation:ringRotateReverse 42s linear infinite;
}

.r4{
    width:61%;
    height:61%;
    border:1px solid rgba(255,105,19,.34);
    border-bottom-color:rgba(255,182,72,.73);
    animation:ringRotate 54s linear infinite;
}

.r5{
    width:69%;
    height:69%;
    border:1px dashed rgba(194,72,12,.30);
    animation:ringRotateReverse 68s linear infinite;
}

.radial-ticks{
    position:absolute;
    inset:13%;
    border-radius:50%;
    background:
        repeating-conic-gradient(
            from 0deg,
            rgba(255,142,38,.55) 0deg .45deg,
            transparent .45deg 5.2deg
        );
    -webkit-mask:
        radial-gradient(
            circle,
            transparent 96%,
            #000 96.8%
        );
    mask:
        radial-gradient(
            circle,
            transparent 96%,
            #000 96.8%
        );
    opacity:.72;
    animation:ringRotateReverse 95s linear infinite;
}


/* ================= DATA BANDS ================= */

.radial-rings::before,
.radial-rings::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
}

.radial-rings::before{
    width:57%;
    height:57%;
    border:1px dotted rgba(255,151,43,.37);
    box-shadow:
        0 0 0 9px rgba(255,105,16,.025),
        0 0 0 18px rgba(255,105,16,.018),
        0 0 0 31px rgba(255,105,16,.014);
}

.radial-rings::after{
    width:73%;
    height:73%;
    border:1px solid rgba(181,63,8,.22);
    border-left-color:rgba(255,137,32,.48);
    animation:ringRotate 90s linear infinite;
}


/* ================= LUMINOUS ARCS ================= */

.radial-arc{
    position:absolute;
    left:50%;
    top:50%;
    width:57%;
    height:57%;
    transform:
        translate(-50%,-50%)
        rotate(var(--rot));
    border-radius:50%;
    border:3px solid transparent;
    border-top-color:rgba(255,126,21,.90);
    border-right-color:rgba(255,74,4,.18);
    filter:drop-shadow(0 0 5px rgba(255,79,0,.75));
    opacity:.78;
    animation:arcPulse 4.8s ease-in-out infinite;
}

.radial-arc:nth-child(2){
    animation-delay:-1.6s;
}

.radial-arc:nth-child(3){
    animation-delay:-3.2s;
}


/* ================= NETWORK ================= */

.radial-network{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:12;
    pointer-events:none;
    overflow:visible;
}

.radial-network line{
    stroke:rgba(224,106,23,.43);
    stroke-width:1;
}

.radial-network circle{
    fill:#090300;
    stroke:rgba(255,151,42,.78);
    stroke-width:1.25;
}

.radial-network .active-line{
    stroke:#ff8f2a;
    stroke-width:1.6;
    filter:drop-shadow(0 0 4px rgba(255,91,0,.75));
}

.radial-network .active-node{
    fill:#ff8d26;
    stroke:#ffd38b;
    filter:drop-shadow(0 0 6px rgba(255,91,0,.85));
}


/* ================= SONG LABELS ================= */

.radial-tracks{
    position:absolute;
    inset:0;
    z-index:18;
}

.radial-track{
    position:absolute;
    width:245px;
    min-height:78px;
    transform:translate(-50%,-50%);
    text-align:center;
    color:#e49a43;
    cursor:pointer;
    padding:3px 6px;
    user-select:none;
    transition:all .35s ease;
    text-shadow:0 0 7px rgba(255,91,0,.18);
}

.radial-track:hover{
    color:#ffd28b;
    transform:
        translate(-50%,-50%)
        scale(1.08);
    text-shadow:0 0 12px rgba(255,107,10,.72);
}

.radial-track.active{
    color:#ffc36d;
    text-shadow:0 0 14px rgba(255,88,0,.85);
}

.radial-track-number{
    font-size:15px;
    letter-spacing:.20em;
    margin-bottom:2px;
    color:#d48730;
}

.radial-track-number::after{
    content:"";
    display:block;
    width:18px;
    height:1px;
    margin:3px auto 4px;
    background:rgba(235,139,41,.55);
}


/* ================= NOUVEAUX GLYPHES JPG ================= */

.radial-track-glyph{
    display:block;
    width:58px;
    height:58px;
    margin:4px auto 6px;
    object-fit:contain;
    opacity:.92;
    filter:
        brightness(1.12)
        contrast(1.10)
        sepia(.35)
        drop-shadow(0 0 5px rgba(255,89,0,.38));
    transform:rotate(-8deg);
    transition:
        transform .35s ease,
        filter .35s ease,
        opacity .35s ease;
}

.radial-track:hover .radial-track-glyph{
    transform:
        rotate(-4deg)
        scale(1.08);
    filter:
        brightness(1.18)
        contrast(1.12)
        sepia(.35)
        drop-shadow(0 0 10px rgba(255,89,0,.70));
}

.radial-track.active .radial-track-glyph{
    opacity:1;
    filter:
        brightness(1.22)
        contrast(1.14)
        sepia(.35)
        drop-shadow(0 0 10px rgba(255,85,0,.80));
}


/* ================= TRACK NAME ================= */

.radial-track-name{
    font-size:18px;
    letter-spacing:.13em;
    line-height:1.35;
    font-family:"Courier New",monospace;
}


/* ================= CENTRAL CORE ================= */

.radial-center{
    position:absolute;
    left:50%;
    top:50%;
    width:38%;
    height:38%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(45,11,2,.90),
            rgba(5,2,0,.97) 72%
        ),
        #020100;
    border:1px solid rgba(255,133,28,.58);
    box-shadow:
        0 0 28px rgba(255,65,0,.22),
        inset 0 0 38px rgba(255,75,0,.15);
    z-index:30;
}

.radial-center::before{
    content:"";
    position:absolute;
    inset:5%;
    border-radius:50%;
    border:1px solid rgba(255,107,20,.22);
    box-shadow:
        0 0 0 8px rgba(255,91,0,.025),
        0 0 0 16px rgba(255,91,0,.018);
    pointer-events:none;
}

.center-sigil{
    position:relative;
    width:88px;
    height:88px;
    border:1px solid rgba(255,143,37,.82);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:15px;
    box-shadow:0 0 17px rgba(255,76,0,.30);
    z-index:2;
}

.center-sigil::before{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:50%;
    border:1px dotted rgba(255,169,64,.62);
    animation:ringRotateReverse 19s linear infinite;
}

.center-sigil img{
    width:66px;
    height:66px;
    object-fit:cover;
    object-position:center;
    clip-path:circle(48% at 50% 50%);
    mix-blend-mode:screen;
    filter:
        sepia(1)
        saturate(2.3)
        hue-rotate(-12deg)
        brightness(1.20)
        contrast(1.12)
        drop-shadow(0 0 8px rgba(255,90,0,.90));
}

.player-title{
    max-width:82%;
    font-size:16px;
    letter-spacing:.24em;
    color:#ffb052;
    margin-bottom:13px;
    text-shadow:0 0 10px rgba(255,94,10,.35);

<script>

/* =========================================================
   INTRO
========================================================= */

const progressFill =
    document.getElementById("progressFill");

const percent =
    document.getElementById("percent");

const status =
    document.getElementById("status");

const info =
    document.getElementById("info");

const intro =
    document.getElementById("intro");

const archive =
    document.getElementById("archive");


const stages = [

    {
        at:0,
        status:"INITIALIZING",
        info:"SEARCHING FOR SIGNAL"
    },

    {
        at:10,
        status:"SCANNING",
        info:"NOISE DETECTED"
    },

    {
        at:22,
        status:"SIGNAL FOUND",
        info:"UNKNOWN SOURCE"
    },

    {
        at:35,
        status:"CONNECTING",
        info:"NODE 004"
    },

    {
        at:48,
        status:"RECONSTRUCTING",
        info:"FRAGMENT 01 FOUND"
    },

    {
        at:61,
        status:"DECODING",
        info:"LANGUAGE UNKNOWN"
    },

    {
        at:74,
        status:"RESTORING",
        info:"MEMORY STRUCTURE STABLE"
    },

    {
        at:87,
        status:"VERIFYING SIGNAL",
        info:"INTEGRITY 92.4%"
    },

    {
        at:100,
        status:"SIGNAL RESTORED",
        info:"ARCHIVE AVAILABLE"
    }

];


let progress = 0;


function updateSequence(){

    progress +=
        Math.random() * 1.4 + .4;

    if(progress > 100){
        progress = 100;
    }


    progressFill.style.width =
        progress + "%";

    percent.textContent =
        Math.floor(progress) + "%";


    let currentStage =
        stages[0];


    for(const stage of stages){

        if(progress >= stage.at){
            currentStage = stage;
        }

    }


    status.textContent =
        currentStage.status;

    info.textContent =
        currentStage.info;


    if(progress >= 100){

        setTimeout(()=>{

            intro.classList.add("hide");

            setTimeout(()=>{

                archive.classList.add("show");

                document.body.style.overflow =
                    "auto";

                initializeArchive();

            },1800);

        },1000);

        return;
    }


    setTimeout(
        updateSequence,
        70 + Math.random() * 110
    );

}


setTimeout(
    updateSequence,
    1500
);


/* =========================================================
   PLAYER
========================================================= */

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("playButton");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

const audioProgress =
    document.getElementById("audioProgress");

const audioProgressFill =
    document.getElementById("audioProgressFill");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const playerTitle =
    document.getElementById("playerTitle");

const errorMessage =
    document.getElementById("errorMessage");


let tracks = [];
let currentTrack = 0;
let currentPath = "";
let initialized = false;


/* =========================================================
   RÉCUPÉRATION DES MP3 GITHUB
========================================================= */

async function getRepositoryAudioFiles(){

    const base =
        "https://api.github.com/repos/iENCH-hub/iENCH-SIGNAL-RESTORED/contents/";


    async function getFolder(path){

        const response =
            await fetch(
                base + path,
                {
                    headers:{
                        "Accept":
                        "application/vnd.github+json"
                    }
                }
            );


        if(!response.ok){
            return [];
        }


        const files =
            await response.json();


        return files
            .filter(item =>
                item.type === "file" &&
                /\.mp3$/i.test(item.name)
            )
            .map(item => item.name);

    }


    try{

        const [
            rootFiles,
            audioFiles
        ] =
        await Promise.all([

            getFolder(""),

            getFolder("audio")

        ]);


        return [
            ...new Set([
                ...audioFiles,
                ...rootFiles
            ])
        ];

    }catch(error){

        console.error(error);

        return [];

    }

}


/* =========================================================
   NOM AFFICHÉ
========================================================= */

function displayTitle(filename){

    return filename
        .replace(/\.mp3$/i,"")
        .replace(/_iENCH$/i,"")
        .replace(/[_-]+/g," ")
        .replace(/\s+/g," ")
        .trim()
        .toUpperCase();

}


/* =========================================================
   CHARGEMENT DES TRACKS
========================================================= */

async function loadTracks(){

    errorMessage.textContent =
        "SCANNING AUDIO ARCHIVE...";


    const filenames =
        await getRepositoryAudioFiles();


    if(!filenames.length){

        errorMessage.textContent =
            "NO MP3 FOUND // CHECK THE GITHUB AUDIO FILES";

        playerTitle.textContent =
            "ARCHIVE EMPTY";

        return;

    }


    tracks =
        filenames.map(
            (filename,index)=>({

                title:
                    displayTitle(filename),

                filename:
                    filename,

                file:
                    "audio/" +
                    encodeURIComponent(filename),

                fallback:
                    encodeURIComponent(filename),

                glyph:
                    "glyphes/glyphe" +
                    ((index % 8) + 1) +
                    ".jpg"

            })
        );


    const omenIndex =
        tracks.findIndex(
            track =>
                track.title.includes(
                    "OMEN NOMENSEYA TOLL"
                )
        );


    if(omenIndex > 0){

        const omen =
            tracks.splice(
                omenIndex,
                1
            )[0];

        tracks.unshift(omen);

    }


    errorMessage.textContent =
        "";

    currentTrack = 0;

    createRadialTrackList();

    loadTrack(0);

}


/* =========================================================
   RADIAL TRACK WHEEL
========================================================= */

const radialTracks =
    document.getElementById("radialTracks");

const radialNetwork =
    document.getElementById("radialNetwork");

const radialPlayer =
    document.getElementById("radialPlayer");


function createRadialTrackList(){

    if(!radialTracks){
        return;
    }


    radialTracks.innerHTML =
        "";

    if(radialNetwork){
        radialNetwork.innerHTML =
            "";
    }


    if(!tracks.length){
        return;
    }


    const count =
        tracks.length;

    const cx = 500;
    const cy = 500;


    const labelRadius =
        count <= 10
            ? 440
            : count <= 14
                ? 452
                : 462;


    const nodeRadius =
        315;


    tracks.forEach(
        (track,index)=>{

            const baseAngle =
                (index / count) *
                Math.PI * 2 -
                Math.PI / 2;


            const angle =
                baseAngle +
                Math.sin(index * 2.11) *
                .045;


            const radius =
                labelRadius +
                Math.sin(index * 1.73) *
                10;


            const x =
                50 +
                Math.cos(angle) *
                (radius / 10);


            const y =
                50 +
                Math.sin(angle) *
                (radius / 10);


            const nodeX =
                cx +
                Math.cos(angle) *
                nodeRadius;


            const nodeY =
                cy +
                Math.sin(angle) *
                nodeRadius;


            /* ================= LIGNE ================= */

            if(radialNetwork){

                const line =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "line"
                    );


                line.dataset.index =
                    index;


                line.setAttribute(
                    "x1",
                    cx
                );

                line.setAttribute(
                    "y1",
                    cy
                );

                line.setAttribute(
                    "x2",
                    nodeX
                );

                line.setAttribute(
                    "y2",
                    nodeY
                );


                radialNetwork.appendChild(
                    line
                );


                const node =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "circle"
                    );


                node.dataset.index =
                    index;


                node.setAttribute(
                    "cx",
                    nodeX
                );

                node.setAttribute(
                    "cy",
                    nodeY
                );

                node.setAttribute(
                    "r",
                    "6"
                );


                radialNetwork.appendChild(
                    node
                );


                if(index % 2 === 0){

                    const orbit =
                        document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "circle"
                        );


                    orbit.dataset.index =
                        "orbit-" + index;


                    orbit.setAttribute(
                        "cx",
                        nodeX
                    );

                    orbit.setAttribute(
                        "cy",
                        nodeY
                    );

                    orbit.setAttribute(
                        "r",
                        "12"
                    );

                    orbit.setAttribute(
                        "fill",
                        "none"
                    );

                    orbit.setAttribute(
                        "stroke",
                        "rgba(255,126,24,.24)"
                    );

                    orbit.setAttribute(
                        "stroke-width",
                        "1"
                    );


                    radialNetwork.appendChild(
                        orbit
                    );

                }

            }


            /* ================= TITRE ================= */

            const element =
                document.createElement("div");


            element.className =
                "radial-track";


            element.dataset.index =
                index;


            element.style.left =
                x + "%";


            element.style.top =
                y + "%";


            const number =
                document.createElement("div");

            number.className =
                "radial-track-number";

            number.textContent =
                String(index + 1)
                    .padStart(2,"0");


            const glyph =
                document.createElement("img");

            glyph.className =
                "radial-track-glyph";

            glyph.src =
                track.glyph;

            glyph.alt =
                "";


            /*
               Si le fichier n'existe pas,
               le glyphe est simplement masqué.
            */

            glyph.onerror =
                function(){

                    this.style.display =
                        "none";

                };


            const name =
                document.createElement("div");

            name.className =
                "radial-track-name";

            name.textContent =
                track.title;


            element.appendChild(
                number
            );

            element.appendChild(
                glyph
            );

            element.appendChild(
                name
            );


            element.addEventListener(
                "click",
                ()=>{

                    loadTrack(index);

                    playAudio();

                }
            );


            radialTracks.appendChild(
                element
            );

        }
    );


    updateRadialTrackStates();

}


/* =========================================================
   CHARGER UN TITRE
========================================================= */

function loadTrack(index){

    if(
        index < 0 ||
        index >= tracks.length
    ){
        return;
    }


    currentTrack =
        index;


    currentPath =
        tracks[index].file;


    audio.pause();

    audio.currentTime =
        0;


    playerTitle.textContent =
        tracks[index].title;


    audioProgressFill.style.width =
        "0%";


    currentTime.textContent =
        "00:00";


    duration.textContent =
        "00:00";


    audio.src =
        currentPath;

    audio.load();


    updateTrackList();

}


/* =========================================================
   FALLBACK MP3 RACINE
========================================================= */

audio.addEventListener(
    "error",
    function(){

        if(!tracks.length){
            return;
        }


        const track =
            tracks[currentTrack];


        if(
            audio.src.includes(
                "/audio/"
            )
        ){

            console.warn(
                "Fichier absent de /audio/, essai à la racine :",
                track.filename
            );


            audio.src =
                track.fallback;


            audio.load();


            return;

        }


        errorMessage.textContent =
            "UNABLE TO READ // " +
            track.filename;

    }
);


/* =========================================================
   PLAY
========================================================= */

function playAudio(){

    if(!tracks.length){
        return;
    }


    audio.play()
        .then(()=>{

            playButton.textContent =
                "❚❚";


            radialPlayer?.classList.add(
                "is-playing"
            );

        })
        .catch(error=>{

            console.error(
                "Audio playback error:",
                error
            );


            errorMessage.textContent =
                "PLAYBACK ERROR // " +
                tracks[currentTrack].filename;

        });

}


/* =========================================================
   PAUSE
========================================================= */

function pauseAudio(){

    audio.pause();

    playButton.textContent =
        "▶";

    radialPlayer?.classList.remove(
        "is-playing"
    );

}


/* =========================================================
   PLAY BUTTON
========================================================= */

playButton.addEventListener(
    "click",
    ()=>{

        if(audio.paused){

            playAudio();

        }else{

            pauseAudio();

        }

    }
);


/* =========================================================
   PREVIOUS
========================================================= */

previousButton.addEventListener(
    "click",
    ()=>{

        if(!tracks.length){
            return;
        }


        if(audio.currentTime > 3){

            audio.currentTime =
                0;

            return;

        }


        currentTrack--;


        if(currentTrack < 0){

            currentTrack =
                tracks.length - 1;

        }


        loadTrack(
            currentTrack
        );

        playAudio();

    }
);


/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(
    "click",
    ()=>{

        if(!tracks.length){
            return;
        }


        currentTrack++;


        if(
            currentTrack >=
            tracks.length
        ){

            currentTrack =
                0;

        }


        loadTrack(
            currentTrack
        );

        playAudio();

    }
);


/* =========================================================
   TITRE SUIVANT
========================================================= */

audio.addEventListener(
    "ended",
    ()=>{

        if(!tracks.length){
            return;
        }


        currentTrack++;


        if(
            currentTrack >=
            tracks.length
        ){

            currentTrack =
                0;

        }


        loadTrack(
            currentTrack
        );

        playAudio();

    }
);


/* =========================================================
   PROGRESSION
========================================================= */

audio.addEventListener(
    "timeupdate",
    ()=>{

        if(
            !audio.duration ||
            !isFinite(audio.duration)
        ){
            return;
        }


        const percentage =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        audioProgressFill.style.width =
            percentage + "%";


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================================================
   DURÉE
========================================================= */

audio.addEventListener(
    "loadedmetadata",
    ()=>{

        if(isFinite(audio.duration)){

            duration.textContent =
                formatTime(
                    audio.duration
                );

        }

    }
);


/* =========================================================
   BARRE DE PROGRESSION
========================================================= */

audioProgress.addEventListener(
    "click",
    event=>{

        if(
            !audio.duration ||
            !isFinite(audio.duration)
        ){
            return;
        }


        const rect =
            audioProgress.getBoundingClientRect();


        const clickPosition =
            event.clientX -
            rect.left;


        const percentage =
            Math.max(
                0,
                Math.min(
                    1,
                    clickPosition /
                    rect.width
                )
            );


        audio.currentTime =
            percentage *
            audio.duration;

    }
);


/* =========================================================
   FORMAT TEMPS
========================================================= */

function formatTime(seconds){

    if(
        isNaN(seconds) ||
        !isFinite(seconds)
    ){

        return "00:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        String(minutes)
            .padStart(2,"0")
        +
        ":"
        +
        String(secs)
            .padStart(2,"0")
    );

}


/* =========================================================
   MISE À JOUR ÉTAT DES TRACKS
========================================================= */

function updateTrackList(){

    updateRadialTrackStates();

}


function updateRadialTrackStates(){

    document
        .querySelectorAll(
            ".radial-track"
        )
        .forEach(
            (el,index)=>{

                el.classList.toggle(
                    "active",
                    index === currentTrack
                );

            }
        );


    if(radialNetwork){

        radialNetwork
            .querySelectorAll("line")
            .forEach(
                (el,index)=>{

                    el.classList.toggle(
                        "active-line",
                        index === currentTrack
                    );

                }
            );


        radialNetwork
            .querySelectorAll("circle")
            .forEach(
                el=>{

                    if(
                        el.dataset.index ===
                        String(currentTrack)
                    ){

                        el.classList.add(
                            "active-node"
                        );

                    }else{

                        el.classList.remove(
                            "active-node"
                        );

                    }

                }
            );

    }

}


/* =========================================================
   DIAPORAMA
========================================================= */

const slideshow =
    document.getElementById(
        "archiveSlideshow"
    );


const slideElements =
    slideshow
        ? Array.from(
            slideshow.querySelectorAll(
                ".slide-photo"
            )
        )
        : [];


let slideshowImages = [];
let slideshowTimer = null;
let slideshowIndex = 0;


/* =========================================================
   IMAGES GITHUB
========================================================= */

async function getRepositoryImageFiles(){

    const base =
        "https://api.github.com/repos/iENCH-hub/iENCH-SIGNAL-RESTORED/contents/";


    async function getFolder(path){

        try{

            const response =
                await fetch(
                    base + path,
                    {
                        headers:{
                            "Accept":
                            "application/vnd.github+json"
                        }
                    }
                );


            if(!response.ok){
                return [];
            }


            const files =
                await response.json();


            return files
                .filter(
                    item =>
                        item.type === "file" &&
                        /\.(jpg|jpeg|png|webp|gif)$/i
                            .test(item.name)
                )
                .map(
                    item => ({
                        name:item.name,
                        path:item.path
                    })
                );

        }catch(e){

            return [];

        }

    }


    const [
        root,
        images
    ] =
    await Promise.all([

        getFolder(""),

        getFolder("images")

    ]);


    const all =
        [...root,...images];


    const unique = [];
    const seen = new Set();


    for(const item of all){

        if(
            item.name.toLowerCase() ===
            "ienchlogo.jpg"
        ){
            continue;
        }


        if(
            item.name.toLowerCase()
                .startsWith("glyphe")
        ){
            continue;
        }


        if(
            seen.has(item.path)
        ){
            continue;
        }


        seen.add(item.path);

        unique.push(item);

    }


    return unique;

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffleArray(array){

    const copy =
        [...array];


    for(
        let i = copy.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


/* =========================================================
   START DIAPORAMA
========================================================= */

function startSlideshow(){

    if(
        !slideElements.length ||
        !slideshowImages.length
    ){
        return;
    }


    slideshowImages =
        shuffleArray(
            slideshowImages
        );


    slideElements.forEach(
        (img,index)=>{

            const item =
                slideshowImages[
                    index %
                    slideshowImages.length
                ];


            img.src =
                "https://raw.githubusercontent.com/iENCH-hub/iENCH-SIGNAL-RESTORED/main/" +
                item.path
                    .split("/")
                    .map(
                        encodeURIComponent
                    )
                    .join("/");


            img.classList.remove(
                "visible"
            );


            setTimeout(
                ()=>{
                    img.classList.add(
                        "visible"
                    );
                },
                100 + index * 240
            );

        }
    );


    slideshowIndex =
        slideElements.length %
        slideshowImages.length;


    clearInterval(
        slideshowTimer
    );


    slideshowTimer =
        setInterval(
            ()=>{

                const slot =
                    Math.floor(
                        Math.random() *
                        slideElements.length
                    );


                const img =
                    slideElements[slot];


                const item =
                    slideshowImages[
                        slideshowIndex %
                        slideshowImages.length
                    ];


                slideshowIndex++;


                img.classList.remove(
                    "visible"
                );


                setTimeout(
                    ()=>{

                        img.src =
                            "https://raw.githubusercontent.com/iENCH-hub/iENCH-SIGNAL-RESTORED/main/" +
                            item.path
                                .split("/")
                                .map(
                                    encodeURIComponent
                                )
                                .join("/");


                        requestAnimationFrame(
                            ()=>{
                                img.classList.add(
                                    "visible"
                                );
                            }
                        );

                    },
                    1200
                );

            },
            3800
        );

}


/* =========================================================
   INITIALISATION DIAPORAMA
========================================================= */

async function initializeSlideshow(){

    slideshowImages =
        await getRepositoryImageFiles();


    if(
        slideshowImages.length
    ){

        startSlideshow();

    }

}


/* =========================================================
   INITIALISATION ARCHIVE
========================================================= */

async function initializeArchive(){

    if(initialized){
        return;
    }


    initialized = true;


    await loadTracks();

    initializeSlideshow();

}
