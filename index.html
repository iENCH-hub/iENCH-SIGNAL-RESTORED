/* ================= iENCH LOGO ANIMATION ================= */

.symbol{width:360px;height:360px;margin-bottom:35px;isolation:isolate;overflow:visible}
.symbol::before{content:"";position:absolute;inset:-55px;z-index:0;border-radius:50%;background:radial-gradient(ellipse at 30% 38%,rgba(255,72,0,.42) 0%,transparent 35%),radial-gradient(ellipse at 72% 62%,rgba(255,120,0,.30) 0%,transparent 38%),radial-gradient(ellipse at 48% 82%,rgba(155,25,0,.38) 0%,transparent 42%);filter:blur(28px);opacity:.75;animation:smokeDrift 18s ease-in-out infinite alternate;pointer-events:none}
.symbol::after{content:"";position:absolute;width:320px;height:320px;z-index:4;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,transparent 24deg,rgba(255,91,0,.95) 42deg,rgba(255,190,30,1) 53deg,rgba(255,91,0,.45) 67deg,transparent 92deg,transparent 155deg,rgba(255,110,0,.85) 174deg,rgba(255,180,30,.95) 188deg,transparent 207deg,transparent 285deg,rgba(255,70,0,.75) 302deg,rgba(255,170,20,1) 315deg,transparent 337deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));filter:drop-shadow(0 0 5px rgba(255,91,0,.9)) drop-shadow(0 0 18px rgba(255,70,0,.45));animation:ringRotate 14s linear infinite,ringPulse 3.8s ease-in-out infinite;pointer-events:none}
.logo-image{position:absolute;z-index:2;width:455px;height:455px;left:50%;top:50%;transform:translate(-50%,-50%);object-fit:cover;object-position:50% 42%;clip-path:circle(47% at 50% 50%);opacity:.96;mix-blend-mode:screen;filter:brightness(1.08) contrast(1.08) drop-shadow(0 0 8px rgba(255,95,0,.85)) drop-shadow(0 0 25px rgba(255,65,0,.42));animation:logoBreath 7s ease-in-out infinite,logoFlicker 5.5s ease-in-out infinite}
.symbol .smoke-layer{position:absolute;inset:-35px;z-index:3;border-radius:50%;background:radial-gradient(ellipse at 18% 58%,rgba(255,80,0,.18),transparent 32%),radial-gradient(ellipse at 82% 42%,rgba(255,130,0,.15),transparent 34%),radial-gradient(ellipse at 50% 10%,rgba(180,30,0,.12),transparent 35%);filter:blur(20px);mix-blend-mode:screen;pointer-events:none;animation:smokePass 22s ease-in-out infinite alternate}

/* ================= ARCHIVE SLIDESHOW ================= */
#archive::before{

}

.slide-photo.s6{right:30%;bottom:2%;transform:rotate(3deg) scale(.88);opacity:.18}
.slide-photo.s7{left:28%;top:28%;transform:rotate(-10deg) scale(.72);opacity:.12}
.slide-photo.s8{right:26%;top:31%;transform:rotate(9deg) scale(.70);opacity:.12}
.slide-photo.visible.s1{transform:rotate(-5deg) scale(1.12) translate(20px,-8px)}
.slide-photo.visible.s2{transform:rotate(4deg) scale(1.04) translate(-18px,14px)}
.slide-photo.visible.s3{transform:rotate(3deg) scale(1.02) translate(-12px,-16px)}
.slide-photo.visible.s4{transform:rotate(-4deg) scale(1.12) translate(16px,10px)}
.slide-photo.visible.s5{transform:rotate(2deg) scale(.94) translate(-18px,10px)}

@keyframes smokeDrift{0%{transform:translate(-12px,8px) scale(1);opacity:.55}35%{transform:translate(8px,-10px) scale(1.06);opacity:.78}70%{transform:translate(-4px,-18px) scale(1.11);opacity:.62}100%{transform:translate(14px,4px) scale(1.04);opacity:.82}}
@keyframes smokePass{0%{transform:translate(-18px,12px) rotate(-3deg) scale(1);opacity:.35}50%{transform:translate(12px,-8px) rotate(3deg) scale(1.08);opacity:.7}100%{transform:translate(-6px,15px) rotate(-2deg) scale(1.12);opacity:.42}}
@keyframes logoBreath{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.025)}}

<script>
/* =========================================================
   INTRO
========================================================= */
const progressFill = document.getElementById("progressFill");
const percent = document.getElementById("percent");
const status = document.getElementById("status");
const info = document.getElementById("info");
const intro = document.getElementById("intro");
const archive = document.getElementById("archive");

const stages = [
    {at:0,  status:"INITIALIZING",      info:"SEARCHING FOR SIGNAL"},
    {at:10, status:"SCANNING",          info:"NOISE DETECTED"},
    {at:22, status:"SIGNAL FOUND",     info:"UNKNOWN SOURCE"},
    {at:35, status:"CONNECTING",        info:"NODE 004"},
    {at:48, status:"RECONSTRUCTING",    info:"FRAGMENT 01 FOUND"},
    {at:61, status:"DECODING",          info:"LANGUAGE UNKNOWN"},
    {at:74, status:"RESTORING",         info:"MEMORY STRUCTURE STABLE"},
    {at:87, status:"VERIFYING SIGNAL",  info:"INTEGRITY 92.4%"},
    {at:100,status:"SIGNAL RESTORED",   info:"ARCHIVE AVAILABLE"}
];

let progress = 0;

function updateSequence(){
    progress += Math.random() * 1.4 + 0.4;
    if(progress > 100) progress = 100;

    progressFill.style.width = progress + "%";
    percent.textContent = Math.floor(progress) + "%";

    let currentStage = stages[0];
    for(const stage of stages){
        if(progress >= stage.at) currentStage = stage;
    }

    status.textContent = currentStage.status;
    info.textContent = currentStage.info;

    if(progress >= 100){
        setTimeout(() => {
            intro.classList.add("hide");

            setTimeout(() => {
                archive.classList.add("show");
                document.body.style.overflow = "auto";
                initializeArchive();
            }, 1800);
        }, 1000);
        return;
    }

    setTimeout(updateSequence, 70 + Math.random() * 110);
}

setTimeout(updateSequence, 1500);


/* =========================================================
   PLAYER
   IMPORTANT:
   Les MP3 peuvent être à la racine OU dans /audio/.
   Le code essaie d'abord audio/NOM.mp3, puis NOM.mp3.
   Ainsi le lecteur fonctionne maintenant et continuera
   à fonctionner lorsque tu déplaceras les MP3 dans /audio/.
========================================================= */

const audio = document.getElementById("audio");
const playButton = document.getElementById("playButton");
const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");
const audioProgress = document.getElementById("audioProgress");
const audioProgressFill = document.getElementById("audioProgressFill");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");
const playerTitle = document.getElementById("playerTitle");
const trackList = document.getElementById("trackList");
const errorMessage = document.getElementById("errorMessage");

let tracks = [];
let currentTrack = 0;
let currentPath = "";
let initialized = false;


/* =========================================================
   LISTE DES TITRES
   On récupère automatiquement les MP3 du dépôt GitHub.
   Cela évite d'avoir à réécrire le code chaque fois que
   tu ajoutes un nouveau morceau.
========================================================= */

async function getRepositoryAudioFiles(){

    const base =
        "https://api.github.com/repos/iENCH-hub/iENCH-SIGNAL-RESTORED/contents/";

    async function getFolder(path){
        const response = await fetch(base + path, {
            headers: { "Accept": "application/vnd.github+json" }
        });

        if(!response.ok) return [];

        const files = await response.json();

        return files
            .filter(item =>
                item.type === "file" &&
                /\.mp3$/i.test(item.name)
            )
            .map(item => item.name);
    }

    try{
        /*
           On regarde les deux emplacements :
           1. la racine du dépôt
           2. le dossier /audio/

           Ainsi tu peux laisser tes MP3 actuels à la racine,
           puis les déplacer dans /audio/ sans refaire le code.
        */
        const [rootFiles, audioFiles] = await Promise.all([
            getFolder(""),
            getFolder("audio")
        ]);

        return [...new Set([...audioFiles, ...rootFiles])];

    }catch(error){
        console.error(error);
        return [];
    }
}


/* =========================================================
   NOM AFFICHÉ
========================================================= */
function displayTitle(filename){

    return filename
        .replace(/\.mp3$/i, "")
        .replace(/_iENCH$/i, "")
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .toUpperCase();
}


/* =========================================================
   CRÉATION DES TRACKS
========================================================= */
async function loadTracks(){

    errorMessage.textContent = "SCANNING AUDIO ARCHIVE...";

    const filenames = await getRepositoryAudioFiles();

    if(!filenames.length){
        errorMessage.textContent =
            "NO MP3 FOUND // CHECK THE GITHUB AUDIO FILES";
        playerTitle.textContent = "ARCHIVE EMPTY";
        return;
    }

    /*
       IMPORTANT :
       Le chemin principal est maintenant :
       audio/NOM EXACT DU FICHIER.mp3

       Si le MP3 est encore à la racine de GitHub,
       le lecteur essaiera automatiquement NOM.mp3.
    */
    tracks = filenames.map(filename => ({
        title: displayTitle(filename),
        filename: filename,
        file: "audio/" + encodeURIComponent(filename),
        fallback: encodeURIComponent(filename)
    }));

    /*
       On place OMEN NOMENSEYA TOLL en premier si présent.
    */
    const omenIndex = tracks.findIndex(track =>
        track.title.includes("OMEN NOMENSEYA TOLL")
    );

    if(omenIndex > 0){
        const omen = tracks.splice(omenIndex, 1)[0];
        tracks.unshift(omen);
    }

    errorMessage.textContent = "";
    currentTrack = 0;

    createTrackList();
    loadTrack(0);
}


/* =========================================================
   AFFICHAGE PLAYLIST
========================================================= */
function createTrackList(){

    trackList.innerHTML = "";

    tracks.forEach((track, index) => {

        const element = document.createElement("div");
        element.className = "track";
        element.dataset.index = index;

        element.innerHTML = `
            <div class="track-number">
                ${String(index + 1).padStart(2, "0")}
            </div>

            <div class="track-name">
                ${escapeHtml(track.title)}
            </div>

            <div class="track-playing">
                ${index === currentTrack ? "●" : ""}
            </div>
        `;

        element.addEventListener("click", () => {
            loadTrack(index);
            playAudio();
        });

        trackList.appendChild(element);
    });

    updateTrackList();
}


/* =========================================================
   SÉCURITÉ TEXTE
========================================================= */
function escapeHtml(text){

    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}


/* =========================================================
   CHARGER UN TITRE
========================================================= */
function loadTrack(index){

    if(index < 0 || index >= tracks.length) return;

    currentTrack = index;
    currentPath = tracks[index].file;

    audio.pause();
    audio.currentTime = 0;

    playerTitle.textContent = tracks[index].title;

    audioProgressFill.style.width = "0%";
    currentTime.textContent = "00:00";
    duration.textContent = "00:00";

    /*
       On commence obligatoirement par /audio/.
    */
    audio.src = currentPath;
    audio.load();

    updateTrackList();
}


/* =========================================================
   SI LE FICHIER N'EST PAS ENCORE DANS /audio/
   on essaie automatiquement le fichier à la racine.
========================================================= */
audio.addEventListener("error", function(){

    if(!tracks.length) return;

    const track = tracks[currentTrack];

    if(audio.src.includes("/audio/")){
        console.warn(
            "Fichier absent de /audio/, essai à la racine :",
            track.filename
        );

        audio.src = track.fallback;
        audio.load();
        return;
    }

    errorMessage.textContent =
        "UNABLE TO READ // " + track.filename;
});


/* =========================================================
   PLAY
========================================================= */
function playAudio(){

    if(!tracks.length) return;

    audio.play()
        .then(() => {
            playButton.textContent = "❚❚";
        })
        .catch(error => {
            console.error("Audio playback error:", error);
            errorMessage.textContent =
                "PLAYBACK ERROR // " + tracks[currentTrack].filename;
        });
}


/* =========================================================
   PAUSE
========================================================= */
function pauseAudio(){

    audio.pause();
    playButton.textContent = "▶";
}


/* =========================================================
   PLAY BUTTON
========================================================= */
playButton.addEventListener("click", () => {

    if(audio.paused){
        playAudio();
    }else{
        pauseAudio();
    }

});


/* =========================================================
   PREVIOUS
========================================================= */
previousButton.addEventListener("click", () => {

    if(!tracks.length) return;

    if(audio.currentTime > 3){
        audio.currentTime = 0;
        return;
    }

    currentTrack--;

    if(currentTrack < 0){
        currentTrack = tracks.length - 1;
    }

    loadTrack(currentTrack);
    playAudio();

});


/* =========================================================
   NEXT
========================================================= */
nextButton.addEventListener("click", () => {

    if(!tracks.length) return;

    currentTrack++;

    if(currentTrack >= tracks.length){
        currentTrack = 0;
    }

    loadTrack(currentTrack);
    playAudio();

});


/* =========================================================
   TITRE SUIVANT AUTOMATIQUE
========================================================= */
audio.addEventListener("ended", () => {

    if(!tracks.length) return;

    currentTrack++;

    if(currentTrack >= tracks.length){
        currentTrack = 0;
    }

    loadTrack(currentTrack);
    playAudio();

});


/* =========================================================
   PROGRESSION
========================================================= */
audio.addEventListener("timeupdate", () => {

    if(!audio.duration || !isFinite(audio.duration)) return;

    const percentage =
        (audio.currentTime / audio.duration) * 100;

    audioProgressFill.style.width = percentage + "%";
    currentTime.textContent = formatTime(audio.currentTime);

});


/* =========================================================
   DURÉE
========================================================= */
audio.addEventListener("loadedmetadata", () => {

    if(isFinite(audio.duration)){
        duration.textContent = formatTime(audio.duration);
    }

});


/* =========================================================
   BARRE DE PROGRESSION
========================================================= */
audioProgress.addEventListener("click", event => {

    if(!audio.duration || !isFinite(audio.duration)) return;

    const rect = audioProgress.getBoundingClientRect();

    const clickPosition =
        event.clientX - rect.left;

    const percentage =
        Math.max(0, Math.min(1, clickPosition / rect.width));

    audio.currentTime =
        percentage * audio.duration;

});


/* =========================================================
   FORMAT TEMPS
========================================================= */
function formatTime(seconds){

    if(isNaN(seconds) || !isFinite(seconds)){
        return "00:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );

}


/* =========================================================
   MISE À JOUR PLAYLIST
========================================================= */
function updateTrackList(){

    const elements =
        document.querySelectorAll(".track");

    elements.forEach((element, index) => {

        element.classList.toggle(
            "active",
            index === currentTrack
        );

        const playing =
            element.querySelector(".track-playing");

        if(playing){
            playing.textContent =
                index === currentTrack ? "●" : "";
        }

    });

}


/* =========================================================
   ÉTRANGE DIAPORAMA // ARCHIVE VISUELLE
   Les images sont récupérées automatiquement depuis GitHub.
   Le lecteur reste au-dessus, lisible et stable.
========================================================= */
const slideshow = document.getElementById("archiveSlideshow");
const slideElements = slideshow ? Array.from(slideshow.querySelectorAll(".slide-photo")) : [];
let slideshowImages = [];
let slideshowTimer = null;
let slideshowIndex = 0;

async function getRepositoryImageFiles(){
    const base = "https://api.github.com/repos/iENCH-hub/iENCH-SIGNAL-RESTORED/contents/";

    async function getFolder(path){
        try{
            const response = await fetch(base + path, {
                headers:{"Accept":"application/vnd.github+json"}
            });
            if(!response.ok) return [];
            const files = await response.json();
            return files
                .filter(item => item.type === "file" && /\.(jpg|jpeg|png|webp|gif)$/i.test(item.name))
                .map(item => ({name:item.name, path:item.path}));
        }catch(e){
            return [];
        }
    }

    const [root, images] = await Promise.all([
        getFolder(""),
        getFolder("images")
    ]);

    const all = [...root, ...images];
    const unique = [];
    const seen = new Set();

    for(const item of all){
        /* Le logo reste réservé au logo animé, pas au diaporama. */
        if(item.name.toLowerCase() === "ienchlogo.jpg") continue;
        if(seen.has(item.path)) continue;
        seen.add(item.path);
        unique.push(item);
    }

    return unique;
}

function shuffleArray(array){
    const copy = [...array];
    for(let i=copy.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
}

function startSlideshow(){
    if(!slideElements.length || !slideshowImages.length) return;

    slideshowImages = shuffleArray(slideshowImages);

    /* Plusieurs images restent simultanément visibles. */
    slideElements.forEach((img,index)=>{
        const item = slideshowImages[index % slideshowImages.length];
        img.src = "https://raw.githubusercontent.com/iENCH-hub/iENCH-SIGNAL-RESTORED/main/" +
            item.path.split("/").map(encodeURIComponent).join("/");
        img.classList.remove("visible");
        setTimeout(()=>img.classList.add("visible"), 100 + index*240);
    });

    slideshowIndex = slideElements.length % slideshowImages.length;

    clearInterval(slideshowTimer);
    slideshowTimer = setInterval(()=>{
        const slot = Math.floor(Math.random()*slideElements.length);
        const img = slideElements[slot];
        const item = slideshowImages[slideshowIndex % slideshowImages.length];
        slideshowIndex++;

        img.classList.remove("visible");

        setTimeout(()=>{
            img.src = "https://raw.githubusercontent.com/iENCH-hub/iENCH-SIGNAL-RESTORED/main/" +
                item.path.split("/").map(encodeURIComponent).join("/");
            requestAnimationFrame(()=>img.classList.add("visible"));
        }, 1200);
    }, 3800);
}

async function initializeSlideshow(){
    slideshowImages = await getRepositoryImageFiles();
    if(slideshowImages.length) startSlideshow();
}

/* =========================================================
   INITIALISATION
========================================================= */
async function initializeArchive(){

    if(initialized) return;

    initialized = true;

    await loadTracks();
    initializeSlideshow();

}
</script>
