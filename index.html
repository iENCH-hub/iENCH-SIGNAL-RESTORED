<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iENCH // NODE 004</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#b8d3bf;
    font-family:"Courier New",monospace;
}

body{overflow:hidden}

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:#000;
    z-index:100;
    transition:opacity 2s ease,visibility 2s ease;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
}

/* ================= iENCH LOGO ANIMATION ================= */

.symbol,
.player-symbol{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.symbol{
    width:360px;
    height:360px;
    margin-bottom:35px;
    isolation:isolate;
    overflow:visible;
}

.symbol::before{
    content:"";
    position:absolute;
    inset:-55px;
    z-index:0;
    border-radius:50%;
    background:
        radial-gradient(
            ellipse at 30% 38%,
            rgba(255,72,0,.42) 0%,
            transparent 35%
        ),
        radial-gradient(
            ellipse at 72% 62%,
            rgba(255,120,0,.30) 0%,
            transparent 38%
        ),
        radial-gradient(
            ellipse at 48% 82%,
            rgba(155,25,0,.38) 0%,
            transparent 42%
        );
    filter:blur(28px);
    opacity:.75;
    animation:smokeDrift 18s ease-in-out infinite alternate;
    pointer-events:none;
}

.symbol::after{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    z-index:4;
    border-radius:50%;
    background:
        conic-gradient(
            from 0deg,
            transparent 0deg,
            transparent 24deg,
            rgba(255,91,0,.95) 42deg,
            rgba(255,190,30,1) 53deg,
            rgba(255,91,0,.45) 67deg,
            transparent 92deg,
            transparent 155deg,
            rgba(255,110,0,.85) 174deg,
            rgba(255,180,30,.95) 188deg,
            transparent 207deg,
            transparent 285deg,
            rgba(255,70,0,.75) 302deg,
            rgba(255,170,20,1) 315deg,
            transparent 337deg
        );
    -webkit-mask:
        radial-gradient(
            farthest-side,
            transparent calc(100% - 2px),
            #000 calc(100% - 2px)
        );
    mask:
        radial-gradient(
            farthest-side,
            transparent calc(100% - 2px),
            #000 calc(100% - 2px)
        );
    filter:
        drop-shadow(0 0 5px rgba(255,91,0,.9))
        drop-shadow(0 0 18px rgba(255,70,0,.45));
    animation:
        ringRotate 14s linear infinite,
        ringPulse 3.8s ease-in-out infinite;
    pointer-events:none;
}

.logo-image{
    position:absolute;
    z-index:2;
    width:453px;
    height:453px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    object-fit:cover;
    object-position:50% 42%;
    clip-path:circle(47% at 50% 50%);
    opacity:.96;
    mix-blend-mode:screen;
    filter:
        brightness(1.08)
        contrast(1.08)
        drop-shadow(0 0 8px rgba(255,95,0,.85))
        drop-shadow(0 0 25px rgba(255,65,0,.42));
    animation:
        logoBreath 7s ease-in-out infinite,
        logoFlicker 5.5s ease-in-out infinite;
}

.symbol .smoke-layer{
    position:absolute;
    inset:-35px;
    z-index:3;
    border-radius:50%;
    background:
        radial-gradient(
            ellipse at 18% 58%,
            rgba(255,80,0,.18),
            transparent 32%
        ),
        radial-gradient(
            ellipse at 82% 42%,
            rgba(255,130,0,.15),
            transparent 34%
        ),
        radial-gradient(
            ellipse at 50% 10%,
            rgba(180,30,0,.12),
            transparent 35%
        );
    filter:blur(20px);
    mix-blend-mode:screen;
    pointer-events:none;
    animation:smokePass 22s ease-in-out infinite alternate;
}

.logo{
    font-family:"DejaVu Sans Light",monospace;
    font-size:42px;
    font-weight:400;
    letter-spacing:.25em;
    margin-left:.25em;
    color:#dce8df;
    opacity:0;
    animation:appear 1s ease forwards;
    animation-delay:.5s;
}

.subtitle{
    margin-top:12px;
    font-size:11px;
    letter-spacing:.4em;
    color:#53665a;
    opacity:0;
    animation:appear 2s ease forwards;
    animation-delay:1.8s;
}

.status{
    margin-top:55px;
    min-height:18px;
    font-size:12px;
    letter-spacing:.2em;
    color:#9eb5a4;
}

.info{
    margin-top:12px;
    min-height:16px;
    font-size:10px;
    letter-spacing:.2em;
    color:#4e6255;
}

.progress-wrapper{
    width:min(500px,70vw);
    margin-top:18px;
}

.progress{
    width:100%;
    height:3px;
    background:#101511;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#b8d3bf;
    box-shadow:0 0 15px rgba(184,211,191,.7);
    transition:width .08s linear;
}

.percent{
    margin-top:10px;
    font-size:10px;
    color:#64776a;
}


/* ================= FULL SCREEN LOGO BACKGROUND ================= */

#archive::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    background:
        radial-gradient(
            circle at center,
            rgba(0,0,0,.05) 0%,
            rgba(0,0,0,.56) 58%,
            rgba(0,0,0,.84) 100%
        ),
        linear-gradient(
            rgba(0,0,0,.20),
            rgba(0,0,0,.42)
        );
    pointer-events:none;
}

.archive-background-logo{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    object-position:center center;
    z-index:0;
    opacity:.78;
    filter:
        brightness(.72)
        contrast(1.12)
        saturate(1.08)
        drop-shadow(0 0 25px rgba(255,80,0,.35));
    transform:scale(1.015);
    animation:
        backgroundLogoBreath 12s ease-in-out infinite,
        backgroundLogoFlicker 7s ease-in-out infinite;
    pointer-events:none;
}

.logo-background-glow{
    position:fixed;
    left:50%;
    top:50%;
    width:min(92vw,1100px);
    height:min(92vw,1100px);
    transform:translate(-50%,-50%);
    z-index:1;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            transparent 48%,
            rgba(255,70,0,.08) 57%,
            rgba(255,100,0,.18) 61%,
            rgba(255,70,0,.04) 70%,
            transparent 76%
        );
    filter:blur(8px);
    animation:backgroundHalo 8s ease-in-out infinite;
    pointer-events:none;
}

.archive-vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,.06) 0%,
            rgba(0,0,0,.18) 38%,
            rgba(0,0,0,.70) 100%
        );
}




/* ================= ARCHIVE ================= */

#archive .player{
    position:relative;
    z-index:20;
}

#archive .player::before{
    content:"";
    position:absolute;
    inset:-100px -140px;
    z-index:-1;
    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,.94) 0%,
            rgba(0,0,0,.82) 38%,
            rgba(0,0,0,.48) 64%,
            transparent 82%
        );
    pointer-events:none;
}

#archive{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(91,24,4,.16),
            transparent 34%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(35,7,1,.35),
            transparent 66%
        ),
        #010101;
    opacity:0;
    visibility:hidden;
    transition:
        opacity 1.8s ease,
        visibility 1.8s ease;
    z-index:10;
    overflow:hidden;
}

#archive.show{
    opacity:1;
    visibility:visible;
}

.archive-background-logo{
    position:absolute;
    left:50%;
    top:50%;
    width:min(1200px,100vw);
    height:min(1200px,100vw);
    transform:translate(-50%,-50%);
    object-fit:cover;
    object-position:center;
    opacity:.035;
    filter:sepia(1) saturate(2) blur(1px);
    pointer-events:none;
    mix-blend-mode:screen;
}

.logo-background-glow{
    position:absolute;
    inset:10%;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,80,0,.11),
            transparent 43%
        ),
        radial-gradient(
            circle,
            rgba(196,69,8,.07),
            transparent 65%
        );
    filter:blur(35px);
    animation:referenceBreath 8s ease-in-out infinite;
    pointer-events:none;
}

.archive-vignette{
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle,
            transparent 35%,
            rgba(0,0,0,.28) 68%,
            rgba(0,0,0,.82) 100%
        ),
        repeating-radial-gradient(
            circle at 50% 50%,
            transparent 0 76px,
            rgba(255,82,12,.025) 77px 78px
        );
    pointer-events:none;
}


/* ================= PLAYER ================= */

.player{
    position:relative;
    width:min(1280px,100vw);
    height:min(960px,100vh);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
}

.radial-player{
    position:relative;
    width:min(900px,92vh,88vw);
    height:min(900px,92vh,88vw);
    min-width:660px;
    min-height:660px;
    isolation:isolate;
}

.radial-player::before{
    content:"";
    position:absolute;
    inset:3%;
    border-radius:50%;
    border:1px solid rgba(225,91,17,.20);
    box-shadow:
        0 0 25px rgba(255,65,0,.10),
        inset 0 0 55px rgba(255,67,0,.08);
    pointer-events:none;
}

.radial-player::after{
    content:"";
    position:absolute;
    inset:-3%;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            transparent 49%,
            rgba(255,91,14,.055) 49.3%,
            transparent 50%
        ),
        radial-gradient(
            circle,
            transparent 62%,
            rgba(255,110,25,.045) 62.2%,
            transparent 62.7%
        ),
        radial-gradient(
            circle,
            transparent 76%,
            rgba(205,65,9,.035) 76.2%,
            transparent 76.8%
        );
    pointer-events:none;
}


/* ================= RADIAL RINGS ================= */

.radial-rings{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.radial-ring{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
}

.r1{
    width:39%;
    height:39%;
    border:1px solid rgba(255,123,27,.66);
    box-shadow:
        0 0 16px rgba(255,78,0,.26),
        inset 0 0 18px rgba(255,70,0,.08);
}

.r2{
    width:46%;
    height:46%;
    border:1px solid rgba(255,164,61,.50);
    border-top-color:#ffb84f;
    border-right-color:rgba(255,83,8,.18);
    animation:ringRotate 28s linear infinite;
}

.r3{
    width:53%;
    height:53%;
    border:1px dashed rgba(224,94,14,.47);
    animation:ringRotateReverse 42s linear infinite;
}

.r4{
    width:61%;
    height:61%;
    border:1px solid rgba(255,105,19,.34);
    border-bottom-color:rgba(255,182,72,.73);
    animation:ringRotate 54s linear infinite;
}

.r5{
    width:69%;
    height:69%;
    border:1px dashed rgba(194,72,12,.30);
    animation:ringRotateReverse 68s linear infinite;
}

.radial-ticks{
    position:absolute;
    inset:13%;
    border-radius:50%;
    background:
        repeating-conic-gradient(
            from 0deg,
            rgba(255,142,38,.55) 0deg .45deg,
            transparent .45deg 5.2deg
        );
    -webkit-mask:
        radial-gradient(
            circle,
            transparent 96%,
            #000 96.8%
        );
    mask:
        radial-gradient(
            circle,
            transparent 96%,
            #000 96.8%
        );
    opacity:.72;
    animation:ringRotateReverse 95s linear infinite;
}


/* ================= DATA BANDS ================= */

.radial-rings::before,
.radial-rings::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
}

.radial-rings::before{
    width:57%;
    height:57%;
    border:1px dotted rgba(255,151,43,.37);
    box-shadow:
        0 0 0 9px rgba(255,105,16,.025),
        0 0 0 18px rgba(255,105,16,.018),
        0 0 0 31px rgba(255,105,16,.014);
}

.radial-rings::after{
    width:73%;
    height:73%;
    border:1px solid rgba(181,63,8,.22);
    border-left-color:rgba(255,137,32,.48);
    animation:ringRotate 90s linear infinite;
}


/* ================= LUMINOUS ARCS ================= */

.radial-arc{
    position:absolute;
    left:50%;
    top:50%;
    width:57%;
    height:57%;
    transform:
        translate(-50%,-50%)
        rotate(var(--rot));
    border-radius:50%;
    border:3px solid transparent;
    border-top-color:rgba(255,126,21,.90);
    border-right-color:rgba(255,74,4,.18);
    filter:drop-shadow(0 0 5px rgba(255,79,0,.75));
    opacity:.78;
    animation:arcPulse 4.8s ease-in-out infinite;
}

.radial-arc:nth-child(2){
    animation-delay:-1.6s;
}

.radial-arc:nth-child(3){
    animation-delay:-3.2s;
}


/* ================= NETWORK ================= */

.radial-network{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:12;
    pointer-events:none;
    overflow:visible;
}

.radial-network line{
    stroke:rgba(224,106,23,.43);
    stroke-width:1;
}

.radial-network circle{
    fill:#090300;
    stroke:rgba(255,151,42,.78);
    stroke-width:1.25;
}

.radial-network .active-line{
    stroke:#ff8f2a;
    stroke-width:1.6;
    filter:drop-shadow(0 0 4px rgba(255,91,0,.75));
}

.radial-network .active-node{
    fill:#ff8d26;
    stroke:#ffd38b;
    filter:drop-shadow(0 0 6px rgba(255,91,0,.85));
}


/* ================= SONG LABELS ================= */

.radial-tracks{
    position:absolute;
    inset:0;
    z-index:18;
}

.radial-track{
    position:absolute;
    width:245px;
    min-height:78px;
    transform:translate(-50%,-50%);
    text-align:center;
    color:#e49a43;
    cursor:pointer;
    padding:3px 6px;
    user-select:none;
    transition:all .35s ease;
    text-shadow:0 0 7px rgba(255,91,0,.18);
}

.radial-track:hover{
    color:#ffd28b;
    transform:
        translate(-50%,-50%)
        scale(1.08);
    text-shadow:0 0 12px rgba(255,107,10,.72);
}

.radial-track.active{
    color:#ffc36d;
    text-shadow:0 0 14px rgba(255,88,0,.85);
}

.radial-track-number{
    display:none;
}

.radial-track-number::after{
    display:none;
}


/* ================= GLYPHES PNG TRANSPARENTS ================= */

.radial-track-glyph{
    display:block;
    width:50px;
    height:50px;
    margin:0 auto -3px;
    object-fit:contain;
    opacity:1;
    background:transparent !important;
    mix-blend-mode:normal;
    filter:
        brightness(1.20)
        contrast(1.15)
        saturate(1.12)
        drop-shadow(0 0 5px rgba(255,120,25,.65))
        drop-shadow(0 0 12px rgba(255,70,0,.28));
    transform:rotate(-4deg);
    transition:transform .35s ease,filter .35s ease,opacity .35s ease;
}

.radial-track:hover .radial-track-glyph{
    transform:
        rotate(-2deg)
        scale(1.08);
    filter:
        brightness(1.24)
        contrast(1.12)
        saturate(1.12)
        drop-shadow(0 0 6px rgba(255,130,35,.75))
        drop-shadow(0 0 14px rgba(255,70,0,.32));
}

.radial-track.active .radial-track-glyph{
    opacity:1;
    transform:scale(1.06);
    filter:
        brightness(1.28)
        contrast(1.14)
        saturate(1.14)
        drop-shadow(0 0 8px rgba(255,145,45,.85))
        drop-shadow(0 0 18px rgba(255,75,0,.38));
}


/* ================= TRACK NAME ================= */

.radial-track-name{
    margin-top:-2px;
    font-size:13px;
    letter-spacing:.08em;
    line-height:1.12;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-weight:400;
}


/* ================= CENTRAL CORE ================= */

.radial-center{
    position:absolute;
    left:50%;
    top:50%;
    width:38%;
    height:38%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(45,11,2,.90),
            rgba(5,2,0,.97) 72%
        ),
        #020100;
    border:1px solid rgba(255,133,28,.58);
    box-shadow:
        0 0 28px rgba(255,65,0,.22),
        inset 0 0 38px rgba(255,75,0,.15);
    z-index:30;
}

.radial-center::before{
    content:"";
    position:absolute;
    inset:5%;
    border-radius:50%;
    border:1px solid rgba(255,107,20,.22);
    box-shadow:
        0 0 0 8px rgba(255,91,0,.025),
        0 0 0 16px rgba(255,91,0,.018);
    pointer-events:none;
}

.center-sigil{
    position:relative;
    width:82px;
    height:82px;
    border:1px solid rgba(255,143,37,.82);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:15px;
    background:#030100;
    box-shadow:0 0 17px rgba(255,76,0,.30);
    z-index:2;
}

.center-sigil::before{
    content:"";
    z-index:3;
    pointer-events:none;
    position:absolute;
    inset:8px;
    border-radius:50%;
    border:1px dotted rgba(255,169,64,.62);
    animation:ringRotateReverse 19s linear infinite;
}

.center-sigil img{
    position:absolute;
    left:50%;
    top:50%;
    width:110px;
    height:110px;
    max-width:none;
    transform:translate(-50%,-53%);
    object-fit:cover;
    object-position:50% 44%;
    border-radius:0;
    mix-blend-mode:screen;
    opacity:1;
    filter:
        brightness(1.08)
        contrast(1.18)
        saturate(1.12)
        drop-shadow(0 0 5px rgba(255,100,0,.65));
}

.player-title{
    max-width:82%;
    font-size:15px;
    letter-spacing:.12em;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-weight:400;
    color:#ffb052;
    margin-bottom:13px;
    text-shadow:0 0 10px rgba(255,94,10,.35);
    z-index:2;
}

.player-subtitle{
    display:none;
}


/* ================= CONTROLS ================= */

.radial-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:12px;
    z-index:2;
}

.control-button{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#e77c17;
    font-family:"Courier New",monospace;
    cursor:pointer;
    font-size:17px;
    transition:.25s ease;
    text-shadow:0 0 8px rgba(255,79,0,.35);
}

.control-button:hover{
    color:#ffd28b;
    transform:scale(1.12);
    text-shadow:0 0 13px rgba(255,91,0,.80);
}

.play-button{
    width:58px;
    height:58px;
    border:1px solid #ed8e26;
    border-radius:50%;
    font-size:19px;
    background:rgba(15,5,1,.58);
    box-shadow:0 0 10px rgba(255,83,0,.13);
}


/* ================= AUDIO PROGRESS ================= */

.audio-progress{
    width:66%;
    height:2px;
    background:rgba(181,80,13,.25);
    cursor:pointer;
    position:relative;
    margin-top:2px;
    z-index:2;
}

.audio-progress-fill{
    width:0%;
    height:100%;
    background:#ff9a30;
    box-shadow:0 0 9px rgba(255,85,0,.85);
}

.time{
    display:flex;
    justify-content:space-between;
    width:66%;
    margin-top:6px;
    font-size:8px;
    color:#a96732;
    z-index:2;
}


/* ================= INFOS ================= */

.error{
    position:absolute;
    left:50%;
    bottom:1%;
    transform:translateX(-50%);
    color:#8c4b28;
    font-size:8px;
    letter-spacing:.12em;
    z-index:40;
    width:100%;
    text-align:center;
}

.player-info{
    position:absolute;
    bottom:-2%;
    left:50%;
    transform:translateX(-50%);
    font-size:8px;
    letter-spacing:.27em;
    color:#8c4d29;
    white-space:nowrap;
}

.radial-player.is-playing .r1{
    animation:centralPulse 2.5s ease-in-out infinite;
}


/* ================= GLYPHES JPG DÉCORATIFS ================= */

.glyph{
    position:fixed;
    width:70px;
    height:70px;
    opacity:.35;
    animation:float 5s ease-in-out infinite alternate;
    pointer-events:none;
    z-index:5;
}

.glyph img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.g1{
    top:15%;
    left:18%;
}

.g2{
    top:30%;
    right:17%;
}

.g3{
    bottom:20%;
    left:20%;
}

.g4{
    bottom:17%;
    right:22%;
}


/* ================= ANIMATIONS ================= */

@keyframes backgroundLogoBreath{
    0%,100%{
        transform:scale(1.015);
    }

    50%{
        transform:scale(1.045);
    }
}

@keyframes backgroundLogoFlicker{
    0%,100%{
        opacity:.74;
    }

    45%{
        opacity:.80;
    }

    47%{
        opacity:.68;
    }

    49%{
        opacity:.79;
    }

    73%{
        opacity:.76;
    }

    75%{
        opacity:.69;
    }

    77%{
        opacity:.78;
    }
}

@keyframes backgroundHalo{
    0%,100%{
        opacity:.55;
        transform:translate(-50%,-50%) scale(.98);
    }

    50%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.035);
    }
}

@keyframes centralPulse{
    0%,100%{
        box-shadow:
            0 0 13px rgba(255,80,0,.18),
            inset 0 0 18px rgba(255,70,0,.08);
    }

    50%{
        box-shadow:
            0 0 30px rgba(255,91,0,.45),
            inset 0 0 30px rgba(255,70,0,.16);
    }
}

@keyframes referenceBreath{
    0%,100%{
        opacity:.55;
        transform:scale(.97);
    }

    50%{
        opacity:1;
        transform:scale(1.04);
    }
}

@keyframes arcPulse{
    0%,100%{
        opacity:.42;
    }

    50%{
        opacity:1;
    }
}

@keyframes ringRotate{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes ringRotateReverse{
    from{
        transform:translate(-50%,-50%) rotate(360deg);
    }

    to{
        transform:translate(-50%,-50%) rotate(0deg);
    }
}

@keyframes ringPulse{
    0%,100%{
        opacity:.62;
        filter:
            drop-shadow(0 0 4px rgba(255,91,0,.7))
            drop-shadow(0 0 14px rgba(255,70,0,.35));
    }

    50%{
        opacity:1;
        filter:
            drop-shadow(0 0 8px rgba(255,150,20,1))
            drop-shadow(0 0 28px rgba(255,70,0,.65));
    }
}

@keyframes smokeDrift{
    0%{
        transform:translate(-12px,8px) scale(1);
        opacity:.55;
    }

    35%{
        transform:translate(8px,-10px) scale(1.06);
        opacity:.78;
    }

    70%{
        transform:translate(-4px,-18px) scale(1.11);
        opacity:.62;
    }

    100%{
        transform:translate(14px,4px) scale(1.04);
        opacity:.82;
    }
}

@keyframes smokePass{
    0%{
        transform:translate(-18px,12px) rotate(-3deg) scale(1);
        opacity:.35;
    }

    50%{
        transform:translate(12px,-8px) rotate(3deg) scale(1.08);
        opacity:.7;
    }

    100%{
        transform:translate(-6px,15px) rotate(-2deg) scale(1.12);
        opacity:.42;
    }
}

@keyframes logoBreath{
    0%,100%{
        transform:translate(-50%,-50%) scale(1);
    }

    50%{
        transform:translate(-50%,-50%) scale(1.025);
    }
}

@keyframes logoFlicker{
    0%,100%{
        opacity:.92;
    }

    46%{
        opacity:1;
    }

    48%{
        opacity:.78;
    }

    50%{
        opacity:1;
    }

    72%{
        opacity:.94;
    }

    74%{
        opacity:.82;
    }

    76%{
        opacity:.97;
    }
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes float{
    from{
        transform:translateY(-8px) rotate(-3deg);
    }

    to{
        transform:translateY(8px) rotate(3deg);
    }
}


/* ================= MOBILE ================= */

@media(max-width:900px){

    .archive-background-logo{
        opacity:.68;
    }

    .archive-slideshow{
        opacity:.24;
    }

    .slide-photo{
        width:38vw;
        height:29vw;
    }

    .slide-photo.s5,
    .slide-photo.s6,
    .slide-photo.s7,
    .slide-photo.s8{
        display:none;
    }
}

@media(max-width:720px){

    #archive{
        overflow:auto;
    }

    .player{
        width:100vw;
        height:100vh;
        min-height:700px;
    }

    .radial-player{
        width:980px;
        height:980px;
        min-width:980px;
        min-height:980px;
        transform:scale(.70);
    }

    .radial-track{
        width:150px;
    }

    .radial-track-name{
        font-size:10px;
    }

    .radial-track-glyph{
        width:42px;
        height:42px;
    }
}

@media(max-width:600px){

    .player{
        width:95vw;
    }

    .symbol{
        width:300px;
        height:300px;
    }

    .symbol::after{
        width:270px;
        height:270px;
    }

    .logo-image{
        width:380px;
        height:380px;
    }

    .player-symbol{
        width:105px;
        height:105px;
    }

    .player-symbol::before{
        width:100px;
        height:100px;
    }

    .player-symbol::after{
        width:70px;
        height:70px;
    }

    .player-logo{
        width:45px;
        height:45px;
    }

    .audio-player{
        padding:18px;
    }

    .player-title{
        font-size:13px;
        letter-spacing:.2em;
    }

    .radial-track-name{
        font-size:8px;
    }

    .radial-track-glyph{
        width:40px;
        height:40px;
    }

    .glyph{
        width:55px;
        height:55px;
    }
}
</style>
</head>

/* =========================================================
   RÉCUPÉRATION DES MP3 GITHUB
========================================================= */

async function getRepositoryAudioFiles(){

    const base =
        "https://api.github.com/repos/iENCH-hub/iENCH-SIGNAL-RESTORED/contents/";


    async function getFolder(path){

        const response =
            await fetch(
                base + path,
                {
                    headers:{
                        "Accept":
                        "application/vnd.github+json"
                    }
                }
            );


        if(!response.ok){
            return [];
        }


        const files =
            await response.json();


        return files
            .filter(item =>
                item.type === "file" &&
                /\.mp3$/i.test(item.name)
            )
            .map(item => item.name);

    }


    try{

        const [
            rootFiles,
            audioFiles
        ] =
        await Promise.all([

            getFolder(""),

            getFolder("audio")

        ]);


        return [
            ...new Set([
                ...audioFiles,
                ...rootFiles
            ])
        ];

    }catch(error){

        console.error(error);

        return [];

    }

}

    return filename

        .replace(/_iENCH$/i,"")
        .replace(/[_-]+/g," ")
        .replace(/\s+/g," ")
        .trim()
        .toUpperCase();

}

async function loadTracks(){

    errorMessage.textContent =
        "SCANNING AUDIO ARCHIVE...";


    let filenames =
        await getRepositoryAudioFiles();


    /*
       IMPORTANT :
       Les traits, petits cercles, titres et glyphes sont construits
       à partir de cette liste. Si l'API GitHub est temporairement
       indisponible ou limitée, on utilise cette liste de secours
       afin que le lecteur radial reste toujours affiché.
    */
    if(!filenames.length){

        filenames = [
            "OMEN NOMENSEYA TOLL.mp3",
            "CHAOS IN THE REVERIE.mp3",
            "YOHOL.mp3",
            "DISHUAL.mp3",
            "ALL OF YOU.mp3",
            "BLOOD FLOWER.mp3"
        ];

        errorMessage.textContent = "";

    }


    tracks =
        filenames.map(
            (filename,index)=>({

                title:
                    displayTitle(filename),

                filename:
                    filename,

                file:
                    "audio/" +
                    encodeURIComponent(filename),

                fallback:
                    encodeURIComponent(filename),

                glyph: embeddedGlyphs[index % embeddedGlyphs.length]

            })
        );


    const omenIndex =
        tracks.findIndex(
            track =>
                track.title.includes(
                    "OMEN NOMENSEYA TOLL"
                )
        );


    if(omenIndex > 0){

        const omen =
            tracks.splice(
                omenIndex,
                1
            )[0];

        tracks.unshift(omen);

    }


    errorMessage.textContent =
        "";

    currentTrack = 0;

    createRadialTrackList();

    loadTrack(0);

}

function createRadialTrackList(){

    if(!radialTracks){
        return;
    }


    radialTracks.innerHTML =
        "";

    if(radialNetwork){
        radialNetwork.innerHTML =
            "";
    }


    if(!tracks.length){
        return;
    }


    const count =
        tracks.length;

    const cx = 500;
    const cy = 500;


    const labelRadius =
        count <= 10
            ? 440
            : count <= 14
                ? 452
                : 462;


    const nodeRadius =
        315;


    tracks.forEach(
        (track,index)=>{

            const baseAngle =
                (index / count) *
                Math.PI * 2 -
                Math.PI / 2;


            const angle =
                baseAngle +
                Math.sin(index * 2.11) *
                .045;


            const radius =
                labelRadius +
                Math.sin(index * 1.73) *
                10;


            const x =
                50 +
                Math.cos(angle) *
                (radius / 10);


            const y =
                50 +
                Math.sin(angle) *
                (radius / 10);


            const nodeX =
                cx +
                Math.cos(angle) *
                nodeRadius;


            const nodeY =
                cy +
                Math.sin(angle) *
                nodeRadius;


            /* ================= LIGNE ================= */

            if(radialNetwork){

                const line =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "line"
                    );


                line.dataset.index =
                    index;


                line.setAttribute(
                    "x1",
                    cx
                );

                line.setAttribute(
                    "y1",
                    cy
                );

                line.setAttribute(
                    "x2",
                    nodeX
                );

                line.setAttribute(
                    "y2",
                    nodeY
                );


                radialNetwork.appendChild(
                    line
                );


                const node =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "circle"
                    );


                node.dataset.index =
                    index;


                node.setAttribute(
                    "cx",
                    nodeX
                );

                node.setAttribute(
                    "cy",
                    nodeY
                );

                node.setAttribute(
                    "r",
                    "6"
                );


                radialNetwork.appendChild(
                    node
                );


                if(index % 2 === 0){

                    const orbit =
                        document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "circle"
                        );


                    orbit.dataset.index =
                        "orbit-" + index;


                    orbit.setAttribute(
                        "cx",
                        nodeX
                    );

                    orbit.setAttribute(
                        "cy",
                        nodeY
                    );

                    orbit.setAttribute(
                        "r",
                        "12"
                    );

                    orbit.setAttribute(
                        "fill",
                        "none"
                    );

                    orbit.setAttribute(
                        "stroke",
                        "rgba(255,126,24,.24)"
                    );

                    orbit.setAttribute(
                        "stroke-width",
                        "1"
                    );


                    radialNetwork.appendChild(
                        orbit
                    );

                }

            }


            /* ================= TITRE ================= */

            const element =
                document.createElement("div");


            element.className =
                "radial-track";


            element.dataset.index =
                index;


            element.style.left =
                x + "%";


            element.style.top =
                y + "%";


            const number =
                document.createElement("div");

            number.className =
                "radial-track-number";

            number.textContent =
                String(index + 1)
                    .padStart(2,"0");


            const glyph =
                document.createElement("img");

            glyph.className =
                "radial-track-glyph";

            glyph.src =
                track.glyph;

            glyph.alt =
                "";


            /*
               Si le fichier n'existe pas,
               le glyphe est simplement masqué.
            */

            glyph.onerror =
                function(){

                    this.style.display =
                        "none";

                };


            const name =
                document.createElement("div");

            name.className =
                "radial-track-name";

            name.textContent =
                track.title;


            element.appendChild(
                number
            );

            element.appendChild(
                glyph
            );

            element.appendChild(
                name
            );


            element.addEventListener(
                "click",
                ()=>{

                    loadTrack(index);

                    playAudio();

                }
            );


            radialTracks.appendChild(
                element
            );

        }
    );


    updateRadialTrackStates();

}


/* =========================================================
   CHARGER UN TITRE
========================================================= */

function loadTrack(index){

    if(
        index < 0 ||
        index >= tracks.length
    ){
        return;
    }


    currentTrack =
        index;


    currentPath =
        tracks[index].file;


    audio.pause();

    audio.currentTime =
        0;


    playerTitle.textContent =
        tracks[index].title;


    audioProgressFill.style.width =
        "0%";


    currentTime.textContent =
        "00:00";


    duration.textContent =
        "00:00";


    audio.src =
        currentPath;

    audio.load();


    updateTrackList();

}


/* =========================================================
   FALLBACK MP3 RACINE
========================================================= */

audio.addEventListener(
    "error",
    function(){

        if(!tracks.length){
            return;
        }


        const track =
            tracks[currentTrack];


        if(
            audio.src.includes(
                "/audio/"
            )
        ){

            console.warn(
                "Fichier absent de /audio/, essai à la racine :",
                track.filename
            );


            audio.src =
                track.fallback;


            audio.load();


            return;

        }


        errorMessage.textContent =
            "UNABLE TO READ // " +
            track.filename;

    }
);


/* =========================================================
   PLAY
========================================================= */

function playAudio(){

    if(!tracks.length){
        return;
    }


    audio.play()
        .then(()=>{

            playButton.textContent =
                "❚❚";


            radialPlayer?.classList.add(
                "is-playing"
            );

        })
        .catch(error=>{

            console.error(
                "Audio playback error:",
                error
            );


            errorMessage.textContent =
                "PLAYBACK ERROR // " +
                tracks[currentTrack].filename;

        });

}


/* =========================================================
   PAUSE
========================================================= */

function pauseAudio(){

    audio.pause();

    playButton.textContent =
        "▶";

    radialPlayer?.classList.remove(
        "is-playing"
    );

}


/* =========================================================
   PLAY BUTTON
========================================================= */

playButton.addEventListener(
    "click",
    ()=>{

        if(audio.paused){

            playAudio();

        }else{

            pauseAudio();

        }

    }
);


/* =========================================================
   PREVIOUS
========================================================= */

previousButton.addEventListener(
    "click",
    ()=>{

        if(!tracks.length){
            return;
        }


        if(audio.currentTime > 3){

            audio.currentTime =
                0;

            return;

        }


        currentTrack--;


        if(currentTrack < 0){

            currentTrack =
                tracks.length - 1;

        }


        loadTrack(
            currentTrack
        );

        playAudio();

    }
);


/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(
    "click",
    ()=>{

        if(!tracks.length){
            return;
        }


        currentTrack++;


        if(
            currentTrack >=
            tracks.length
        ){

            currentTrack =
                0;

        }


        loadTrack(
            currentTrack
        );

        playAudio();

    }
);


/* =========================================================
   TITRE SUIVANT
========================================================= */

audio.addEventListener(
    "ended",
    ()=>{

        if(!tracks.length){
            return;
        }


        currentTrack++;


        if(
            currentTrack >=
            tracks.length
        ){

            currentTrack =
                0;

        }


        loadTrack(
            currentTrack
        );

        playAudio();

    }
);


/* =========================================================
   PROGRESSION
========================================================= */

audio.addEventListener(
    "timeupdate",
    ()=>{

        if(
            !audio.duration ||
            !isFinite(audio.duration)
        ){
            return;
        }


        const percentage =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        audioProgressFill.style.width =
            percentage + "%";


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================================================
   DURÉE
========================================================= */

audio.addEventListener(
    "loadedmetadata",
    ()=>{

        if(isFinite(audio.duration)){

            duration.textContent =
                formatTime(
                    audio.duration
                );

        }

    }
);


/* =========================================================
   BARRE DE PROGRESSION
========================================================= */

audioProgress.addEventListener(
    "click",
    event=>{

        if(
            !audio.duration ||
            !isFinite(audio.duration)
        ){
            return;
        }


        const rect =
            audioProgress.getBoundingClientRect();


        const clickPosition =
            event.clientX -
            rect.left;


        const percentage =
            Math.max(
                0,
                Math.min(
                    1,
                    clickPosition /
                    rect.width
                )
            );


        audio.currentTime =
            percentage *
            audio.duration;

    }
);


/* =========================================================
   FORMAT TEMPS
========================================================= */

function formatTime(seconds){

    if(
        isNaN(seconds) ||
        !isFinite(seconds)
    ){

        return "00:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        String(minutes)
            .padStart(2,"0")
        +
        ":"
        +
        String(secs)
            .padStart(2,"0")
    );

}


/* =========================================================
   MISE À JOUR ÉTAT DES TRACKS
========================================================= */

function updateTrackList(){

    updateRadialTrackStates();

}


function updateRadialTrackStates(){

    document
        .querySelectorAll(
            ".radial-track"
        )
        .forEach(
            (el,index)=>{

                el.classList.toggle(
                    "active",
                    index === currentTrack
                );

            }
        );


    if(radialNetwork){

        radialNetwork
            .querySelectorAll("line")
            .forEach(
                (el,index)=>{

                    el.classList.toggle(
                        "active-line",
                        index === currentTrack
                    );

                }
            );


        radialNetwork
            .querySelectorAll("circle")
            .forEach(
                el=>{

                    if(
                        el.dataset.index ===
                        String(currentTrack)
                    ){

                        el.classList.add(
                            "active-node"
                        );

                    }else{

                        el.classList.remove(
                            "active-node"
                        );

                    }

                }
            );

    }

}





/* =========================================================
   IMAGES GITHUB
========================================================= */

async function getRepositoryImageFiles(){

    const base =
        "https://api.github.com/repos/iENCH-hub/iENCH-SIGNAL-RESTORED/contents/";


    async function getFolder(path){

        try{

            const response =
                await fetch(
                    base + path,
                    {
                        headers:{
                            "Accept":
                            "application/vnd.github+json"
                        }
                    }
                );


            if(!response.ok){
                return [];
            }


            const files =
                await response.json();


            return files
                .filter(
                    item =>
                        item.type === "file" &&
                        /\.(jpg|jpeg|png|webp|gif)$/i
                            .test(item.name)
                )
                .map(
                    item => ({
                        name:item.name,
                        path:item.path
                    })
                );

        }catch(e){

            return [];

        }

    }


    const [
        root,
        images
    ] =
    await Promise.all([

        getFolder(""),

        getFolder("images")

    ]);


    const all =
        [...root,...images];


    const unique = [];
    const seen = new Set();


    for(const item of all){

        if(
            item.name.toLowerCase() ===
            "ienchlogo.png"
        ){
            continue;
        }


        if(
            item.name.toLowerCase()
                .startsWith("glyphe")
        ){
            continue;
        }


        if(
            seen.has(item.path)
        ){
            continue;
        }


        seen.add(item.path);

        unique.push(item);

    }


    return unique;

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffleArray(array){

    const copy =
        [...array];


    for(
        let i = copy.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}
