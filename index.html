<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iENCH // NODE 004</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#b8d3bf;
    font-family:"Courier New",monospace;
}
body{overflow:hidden}

/* ================= INTRO ================= */
#intro{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:#000;
    z-index:100;
    transition:opacity 2s ease,visibility 2s ease;
}
#intro.hide{opacity:0;visibility:hidden}

/* ================= iENCH LOGO ANIMATION ================= */
.symbol,.player-symbol{position:relative;display:flex;justify-content:center;align-items:center}
.symbol{width:360px;height:360px;margin-bottom:35px;isolation:isolate;overflow:visible}
.symbol::before{content:"";position:absolute;inset:-55px;z-index:0;border-radius:50%;background:radial-gradient(ellipse at 30% 38%,rgba(255,72,0,.42) 0%,transparent 35%),radial-gradient(ellipse at 72% 62%,rgba(255,120,0,.30) 0%,transparent 38%),radial-gradient(ellipse at 48% 82%,rgba(155,25,0,.38) 0%,transparent 42%);filter:blur(28px);opacity:.75;animation:smokeDrift 18s ease-in-out infinite alternate;pointer-events:none}
.symbol::after{content:"";position:absolute;width:320px;height:320px;z-index:4;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,transparent 24deg,rgba(255,91,0,.95) 42deg,rgba(255,190,30,1) 53deg,rgba(255,91,0,.45) 67deg,transparent 92deg,transparent 155deg,rgba(255,110,0,.85) 174deg,rgba(255,180,30,.95) 188deg,transparent 207deg,transparent 285deg,rgba(255,70,0,.75) 302deg,rgba(255,170,20,1) 315deg,transparent 337deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));filter:drop-shadow(0 0 5px rgba(255,91,0,.9)) drop-shadow(0 0 18px rgba(255,70,0,.45));animation:ringRotate 14s linear infinite,ringPulse 3.8s ease-in-out infinite;pointer-events:none}
.logo-image{position:absolute;z-index:2;width:455px;height:455px;left:50%;top:50%;transform:translate(-50%,-50%);object-fit:cover;object-position:50% 42%;clip-path:circle(47% at 50% 50%);opacity:.96;mix-blend-mode:screen;filter:brightness(1.08) contrast(1.08) drop-shadow(0 0 8px rgba(255,95,0,.85)) drop-shadow(0 0 25px rgba(255,65,0,.42));animation:logoBreath 7s ease-in-out infinite,logoFlicker 5.5s ease-in-out infinite}
.symbol .smoke-layer{position:absolute;inset:-35px;z-index:3;border-radius:50%;background:radial-gradient(ellipse at 18% 58%,rgba(255,80,0,.18),transparent 32%),radial-gradient(ellipse at 82% 42%,rgba(255,130,0,.15),transparent 34%),radial-gradient(ellipse at 50% 10%,rgba(180,30,0,.12),transparent 35%);filter:blur(20px);mix-blend-mode:screen;pointer-events:none;animation:smokePass 22s ease-in-out infinite alternate}
.logo{
    font-family:"DejaVu Sans Light",monospace;
    font-size:42px;
    font-weight:400;
    letter-spacing:.25em;
    margin-left:.25em;
    color:#dce8df;
    opacity:0;
    animation:appear 1s ease forwards;
    animation-delay:.5s;
}
.subtitle{
    margin-top:12px;
    font-size:11px;
    letter-spacing:.4em;
    color:#53665a;
    opacity:0;
    animation:appear 2s ease forwards;
    animation-delay:1.8s;
}
.status{
    margin-top:55px;
    min-height:18px;
    font-size:12px;
    letter-spacing:.2em;
    color:#9eb5a4;
}
.info{
    margin-top:12px;
    min-height:16px;
    font-size:10px;
    letter-spacing:.2em;
    color:#4e6255;
}
.progress-wrapper{
    width:min(500px,70vw);
    margin-top:18px;
}
.progress{
    width:100%;
    height:3px;
    background:#101511;
    overflow:hidden;
}
.progress-fill{
    width:0%;
    height:100%;
    background:#b8d3bf;
    box-shadow:0 0 15px rgba(184,211,191,.7);
    transition:width .08s linear;
}
.percent{
    margin-top:10px;
    font-size:10px;
    color:#64776a;
}

/* ================= FULL SCREEN LOGO BACKGROUND ================= */
#archive::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    background:
        radial-gradient(circle at center, rgba(0,0,0,.05) 0%, rgba(0,0,0,.56) 58%, rgba(0,0,0,.84) 100%),
        linear-gradient(rgba(0,0,0,.20), rgba(0,0,0,.42));
    pointer-events:none;
}

.archive-background-logo{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    object-position:center center;
    z-index:0;
    opacity:.78;
    filter:brightness(.72) contrast(1.12) saturate(1.08)
           drop-shadow(0 0 25px rgba(255,80,0,.35));
    transform:scale(1.015);
    animation:backgroundLogoBreath 12s ease-in-out infinite,
              backgroundLogoFlicker 7s ease-in-out infinite;
    pointer-events:none;
}

.logo-background-glow{
    position:fixed;
    left:50%;
    top:50%;
    width:min(92vw,1100px);
    height:min(92vw,1100px);
    transform:translate(-50%,-50%);
    z-index:1;
    border-radius:50%;
    background:radial-gradient(circle, transparent 48%,
        rgba(255,70,0,.08) 57%,
        rgba(255,100,0,.18) 61%,
        rgba(255,70,0,.04) 70%, transparent 76%);
    filter:blur(8px);
    animation:backgroundHalo 8s ease-in-out infinite;
    pointer-events:none;
}

.archive-vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:radial-gradient(ellipse at center,
        rgba(0,0,0,.06) 0%,
        rgba(0,0,0,.18) 38%,
        rgba(0,0,0,.70) 100%);
}

/* ================= DIAPORAMA ================= */
.archive-slideshow{
    position:fixed;
    inset:0;
    z-index:3;
    overflow:hidden;
    pointer-events:none;
    opacity:.34;
    mix-blend-mode:screen;
}

.slide-photo{
    position:absolute;
    width:clamp(220px,26vw,430px);
    height:clamp(160px,20vw,320px);
    object-fit:cover;
    opacity:0;
    border:1px solid rgba(255,120,40,.16);
    box-shadow:0 0 35px rgba(0,0,0,.7);
    filter:saturate(.55) contrast(1.08) brightness(.45);
    transition:opacity 2.8s ease, transform 10s cubic-bezier(.2,.7,.2,1),
               filter 2.4s ease;
}

.slide-photo.visible{
    opacity:.34;
    filter:saturate(.62) contrast(1.08) brightness(.50);
}

.slide-photo.s1{left:1%;top:6%;transform:rotate(-8deg) scale(1.02)}
.slide-photo.s2{right:1%;top:5%;transform:rotate(7deg) scale(.98)}
.slide-photo.s3{left:5%;bottom:5%;transform:rotate(5deg) scale(.95)}
.slide-photo.s4{right:5%;bottom:4%;transform:rotate(-7deg) scale(1.02)}
.slide-photo.s5{left:24%;top:1%;transform:rotate(-3deg) scale(.75)}
.slide-photo.s6{right:24%;bottom:0%;transform:rotate(4deg) scale(.78)}
.slide-photo.s7{left:10%;top:35%;transform:rotate(-11deg) scale(.68)}
.slide-photo.s8{right:10%;top:33%;transform:rotate(10deg) scale(.68)}

.slide-photo.visible.s1{transform:rotate(-5deg) scale(1.10) translate(24px,-10px)}
.slide-photo.visible.s2{transform:rotate(4deg) scale(1.06) translate(-22px,14px)}
.slide-photo.visible.s3{transform:rotate(3deg) scale(1.03) translate(-15px,-18px)}
.slide-photo.visible.s4{transform:rotate(-4deg) scale(1.10) translate(18px,12px)}
.slide-photo.visible.s5{transform:rotate(2deg) scale(.88) translate(-18px,12px)}
.slide-photo.visible.s6{transform:rotate(-2deg) scale(.91) translate(16px,-10px)}
.slide-photo.visible.s7{transform:rotate(-7deg) scale(.80) translate(-10px,14px)}
.slide-photo.visible.s8{transform:rotate(7deg) scale(.80) translate(12px,-12px)}

.slideshow-noise{
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,.07) .6px,transparent .6px);
    background-size:4px 4px;
    opacity:.055;
    mix-blend-mode:screen;
}

/* Le lecteur reste parfaitement lisible au-dessus du décor. */
#archive .player{
    position:relative;
    z-index:20;
}

#archive .player::before{
    content:"";
    position:absolute;
    inset:-100px -140px;
    z-index:-1;
    background:radial-gradient(ellipse at center,
        rgba(0,0,0,.94) 0%,
        rgba(0,0,0,.82) 38%,
        rgba(0,0,0,.48) 64%,
        transparent 82%);
    pointer-events:none;
}

@keyframes backgroundLogoBreath{
    0%,100%{transform:scale(1.015)}
    50%{transform:scale(1.045)}
}
@keyframes backgroundLogoFlicker{
    0%,100%{opacity:.74}
    45%{opacity:.80}
    47%{opacity:.68}
    49%{opacity:.79}
    73%{opacity:.76}
    75%{opacity:.69}
    77%{opacity:.78}
}
@keyframes backgroundHalo{
    0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.98)}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1.035)}
}

@media(max-width:900px){
    .archive-background-logo{opacity:.68}
    .archive-slideshow{opacity:.24}
    .slide-photo{width:38vw;height:29vw}
    .slide-photo.s5,.slide-photo.s6,.slide-photo.s7,.slide-photo.s8{display:none}
}
@media(max-width:600px){
    .archive-background-logo{opacity:.62}
    .logo-background-glow{width:115vw;height:115vw}
    .archive-slideshow{opacity:.18}
    .slide-photo{width:50vw;height:38vw}
    .slide-photo.s1{left:-14%;top:7%}
    .slide-photo.s2{right:-14%;top:9%}
    .slide-photo.s3{left:-10%;bottom:8%}
    .slide-photo.s4{right:-11%;bottom:7%}
    #archive .player::before{inset:-50px -35px}
}

/* ================= ARCHIVE / RADIAL PLAYER ================= */
#archive{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    opacity:0;
    visibility:hidden;
    transition:opacity 2s ease,visibility 2s ease;
    z-index:10;
    overflow-y:auto;
    padding:20px;
}
#archive.show{opacity:1;visibility:visible}

.player{
    position:relative;
    width:min(1180px,96vw);
    height:min(900px,94vh);
    min-height:650px;
    text-align:center;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
}

.radial-player{
    position:relative;
    width:min(820px,82vh,82vw);
    height:min(820px,82vh,82vw);
    min-width:600px;
    min-height:600px;
    max-width:820px;
    max-height:820px;
    isolation:isolate;
}

.radial-player::before{
    content:"";
    position:absolute;
    inset:-12%;
    z-index:-5;
    border-radius:50%;
    background:
        radial-gradient(circle at 30% 35%,rgba(255,75,0,.17),transparent 33%),
        radial-gradient(circle at 72% 65%,rgba(190,45,0,.14),transparent 36%),
        radial-gradient(circle at 50% 50%,rgba(255,135,25,.09),transparent 55%);
    filter:blur(28px);
    animation:radialBreath 9s ease-in-out infinite;
}

.radial-rings{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.radial-ring{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
}

.r1{width:40%;height:40%;border:1px solid rgba(255,175,70,.72);box-shadow:0 0 14px rgba(255,75,0,.25)}
.r2{width:49%;height:49%;border:1px solid rgba(255,105,20,.46);border-top-color:rgba(255,190,70,.95);animation:ringRotate 24s linear infinite}
.r3{width:58%;height:58%;border:1px dashed rgba(220,105,25,.40);animation:ringRotateReverse 31s linear infinite}
.r4{width:67%;height:67%;border:1px solid rgba(255,120,30,.30);border-left-color:rgba(255,190,65,.78);animation:ringRotate 39s linear infinite}
.r5{width:76%;height:76%;border:1px dashed rgba(185,75,15,.27);animation:ringRotateReverse 49s linear infinite}

.radial-ticks{
    position:absolute;
    inset:12%;
    border-radius:50%;
    background:repeating-conic-gradient(from 0deg,rgba(255,145,40,.52) 0deg .65deg,transparent .65deg 8deg);
    -webkit-mask:radial-gradient(circle,transparent 96%,#000 97%);
    mask:radial-gradient(circle,transparent 96%,#000 97%);
    opacity:.55;
    animation:ringRotateReverse 70s linear infinite;
}

/* Organic arcs / broken luminous segments */
.radial-arc{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) rotate(var(--rot));
    width:64%;
    height:64%;
    border-radius:50%;
    border:3px solid transparent;
    border-top-color:rgba(255,145,35,.82);
    border-right-color:rgba(255,90,10,.35);
    -webkit-mask:linear-gradient(#000 0 0);
    mask:linear-gradient(#000 0 0);
    opacity:.75;
    filter:drop-shadow(0 0 5px rgba(255,90,0,.55));
    animation:arcPulse 4s ease-in-out infinite;
}

.radial-center{
    position:absolute;
    left:50%;
    top:50%;
    width:36%;
    height:36%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle,rgba(22,8,2,.94),rgba(4,2,1,.97) 72%,#000 100%);
    border:1px solid rgba(255,140,35,.62);
    box-shadow:0 0 25px rgba(255,70,0,.22),inset 0 0 35px rgba(255,90,0,.13);
    z-index:30;
}

.center-sigil{
    width:58px;
    height:58px;
    border:1px solid rgba(255,160,55,.78);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
    box-shadow:0 0 15px rgba(255,85,0,.25);
}
.center-sigil img{
    width:49px;
    height:49px;
    object-fit:cover;
    object-position:center;
    clip-path:circle(47% at 50% 50%);
    mix-blend-mode:screen;
    filter:brightness(1.15) contrast(1.1) saturate(1.15) drop-shadow(0 0 6px rgba(255,105,20,.8));
}

.player-title{
    max-width:86%;
    font-size:12px;
    letter-spacing:.24em;
    color:#edb66b;
    margin-bottom:7px;
    text-shadow:0 0 10px rgba(255,105,20,.28);
}
.player-subtitle{
    font-size:7px;
    letter-spacing:.20em;
    color:#8d6848;
    margin-bottom:13px;
}

.radial-controls{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:9px}
.control-button{
    width:35px;height:35px;border:1px solid rgba(220,135,55,.60);border-radius:50%;
    background:rgba(12,5,1,.78);color:#e7a75b;font-family:"Courier New",monospace;
    cursor:pointer;font-size:10px;transition:.25s ease;
}
.control-button:hover{
    background:rgba(255,110,20,.18);color:#ffd08b;border-color:#ffae4d;
    box-shadow:0 0 15px rgba(255,90,0,.35);
}
.play-button{width:46px;height:46px;font-size:14px;border-color:#e99a3c}

.audio-progress{
    width:64%;height:2px;background:rgba(180,95,25,.18);cursor:pointer;position:relative;margin-top:2px;
}
.audio-progress-fill{width:0%;height:100%;background:#ef9b3b;box-shadow:0 0 9px rgba(255,100,15,.8)}
.time{display:flex;justify-content:space-between;width:64%;margin-top:5px;font-size:7px;color:#76583e}

/* Clickable titles */
.radial-tracks{position:absolute;inset:0;z-index:18}
.radial-track{
    position:absolute;
    width:150px;
    min-height:42px;
    transform:translate(-50%,-50%);
    text-align:center;
    color:#a8784b;
    cursor:pointer;
    padding:4px 6px;
    user-select:none;
    transition:.3s ease;
}
.radial-track:hover{
    color:#ffd08b;
    text-shadow:0 0 10px rgba(255,110,20,.60);
    transform:translate(-50%,-50%) scale(1.08);
}
.radial-track.active{color:#ffc071;text-shadow:0 0 13px rgba(255,90,0,.7)}
.radial-track-number{font-size:7px;letter-spacing:.18em;opacity:.65;margin-bottom:2px}
.radial-track-name{font-size:8px;letter-spacing:.12em;line-height:1.35}
.radial-track-glyph{
    display:block;font-size:17px;line-height:17px;color:#d88a36;opacity:.78;
    margin:1px auto 3px;font-family:"Times New Roman",serif;transform:rotate(-8deg);
}
.radial-track.active .radial-track-glyph{color:#ffb34d;opacity:1}

.radial-network{
    position:absolute;inset:0;width:100%;height:100%;z-index:12;pointer-events:none;overflow:visible;
}
.radial-network line{stroke:rgba(222,112,27,.30);stroke-width:1}
.radial-network circle{fill:#120702;stroke:rgba(255,145,45,.68);stroke-width:1.2}
.radial-network .active-line{stroke:rgba(255,158,54,.95);filter:drop-shadow(0 0 4px rgba(255,100,10,.7))}
.radial-network .active-node{fill:#ff9c32;stroke:#ffd28d}

.track-list{display:none}
.error{
    position:absolute;left:50%;bottom:4%;transform:translateX(-50%);
    color:#8a5a43;font-size:8px;letter-spacing:.12em;z-index:40;width:100%;
}
.player-info{
    position:absolute;bottom:-1%;left:50%;transform:translateX(-50%);
    font-size:7px;letter-spacing:.20em;color:#634932;white-space:nowrap;
}

.radial-player.is-playing .r1{animation:ringPulseRadial 2.2s ease-in-out infinite}
@keyframes ringPulseRadial{
    0%,100%{box-shadow:0 0 10px rgba(255,80,0,.18);opacity:.72}
    50%{box-shadow:0 0 28px rgba(255,100,10,.52);opacity:1}
}
@keyframes radialBreath{0%,100%{transform:scale(.97);opacity:.62}50%{transform:scale(1.04);opacity:1}}
@keyframes arcPulse{0%,100%{opacity:.48}50%{opacity:1}}
@keyframes ringRotate{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes ringRotateReverse{from{transform:translate(-50%,-50%) rotate(360deg)}to{transform:translate(-50%,-50%) rotate(0deg)}}

@media(max-width:700px){
    #archive{padding:5px}
    .player{width:100vw;height:94vh;min-height:560px}
    .radial-player{width:112vw;height:112vw;min-width:0;min-height:0}
    .radial-track{width:102px}
    .radial-track-name{font-size:7px;letter-spacing:.08em}
    .radial-track-glyph{font-size:14px}
    .radial-center{width:39%;height:39%}
    .player-info{display:none}
}
/* ================= GLYPHES ================= */
.glyph{
    position:fixed;
    color:#29382e;
    font-size:14px;
    opacity:.35;
    animation:float 5s ease-in-out infinite alternate;
    pointer-events:none;
}
.g1{top:15%;left:18%}
.g2{top:30%;right:17%}
.g3{bottom:20%;left:20%}
.g4{bottom:17%;right:22%}

/* ================= ANIMATIONS ================= */
@keyframes ringRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes ringPulse{0%,100%{opacity:.62;filter:drop-shadow(0 0 4px rgba(255,91,0,.7)) drop-shadow(0 0 14px rgba(255,70,0,.35))}50%{opacity:1;filter:drop-shadow(0 0 8px rgba(255,150,20,1)) drop-shadow(0 0 28px rgba(255,70,0,.65))}}
@keyframes smokeDrift{0%{transform:translate(-12px,8px) scale(1);opacity:.55}35%{transform:translate(8px,-10px) scale(1.06);opacity:.78}70%{transform:translate(-4px,-18px) scale(1.11);opacity:.62}100%{transform:translate(14px,4px) scale(1.04);opacity:.82}}
@keyframes smokePass{0%{transform:translate(-18px,12px) rotate(-3deg) scale(1);opacity:.35}50%{transform:translate(12px,-8px) rotate(3deg) scale(1.08);opacity:.7}100%{transform:translate(-6px,15px) rotate(-2deg) scale(1.12);opacity:.42}}
@keyframes logoBreath{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.025)}}
@keyframes logoFlicker{0%,100%{opacity:.92}46%{opacity:1}48%{opacity:.78}50%{opacity:1}72%{opacity:.94}74%{opacity:.82}76%{opacity:.97}}
@keyframes appear{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
}
@keyframes float{
    from{transform:translateY(-8px) rotate(-3deg)}
    to{transform:translateY(8px) rotate(3deg)}
}

@media(max-width:600px){
    .player{width:95vw}
    .symbol{width:300px;height:300px}
    .symbol::after{width:270px;height:270px}
    .logo-image{width:380px;height:380px}
    .player-symbol{width:105px;height:105px}
    .player-symbol::before{width:100px;height:100px}
    .player-symbol::after{width:70px;height:70px}
    .player-logo{width:45px;height:45px}
    .audio-player{padding:18px}
    .player-title{font-size:11px;letter-spacing:.2em}
    .track-name{font-size:9px}
    .track-list{max-height:50vh}
}
</style>
</head>

<body>

<div class="glyph g1">𐌗</div>
<div class="glyph g2">◉</div>
<div class="glyph g3">⋔</div>
<div class="glyph g4">⟟</div>

<section id="intro">
    <div class="symbol">
        <img src="ienchlogo.jpg" class="logo-image" alt="iENCH">
        <div class="smoke-layer"></div>
    </div>

    <div class="logo">iENCH</div>
    <div class="subtitle">ARCHIVE NODE 004</div>

    <div id="status" class="status">INITIALIZING</div>
    <div id="info" class="info">SEARCHING FOR SIGNAL</div>

    <div class="progress-wrapper">
        <div class="progress">
            <div id="progressFill" class="progress-fill"></div>
        </div>
        <div id="percent" class="percent">0%</div>
    </div>
</section>

<section id="archive">
    <img src="ienchlogo.jpg" class="archive-background-logo" alt="" aria-hidden="true">
    <div class="logo-background-glow" aria-hidden="true"></div>
    <div class="archive-vignette" aria-hidden="true">

    </div>

    <div id="archiveSlideshow" class="archive-slideshow" aria-hidden="true">
        <img class="slide-photo s1" alt="">
        <img class="slide-photo s2" alt="">
        <img class="slide-photo s3" alt="">
        <img class="slide-photo s4" alt="">
        <img class="slide-photo s5" alt="">
        <img class="slide-photo s6" alt="">
        <img class="slide-photo s7" alt="">
        <img class="slide-photo s8" alt="">
        <div class="slideshow-noise"></div>
    </div>

    <div class="player">
        <div class="radial-player" id="radialPlayer">

            <div class="radial-rings" aria-hidden="true">
                <div class="radial-ring r1"></div>
                <div class="radial-ring r2"></div>
                <div class="radial-ring r3"></div>
                <div class="radial-ring r4"></div>
                <div class="radial-ring r5"></div>
                <div class="radial-ticks"></div>
                <div class="radial-arc" style="--rot:18deg"></div>
                <div class="radial-arc" style="--rot:153deg"></div>
                <div class="radial-arc" style="--rot:276deg"></div>
            </div>

            <svg class="radial-network" id="radialNetwork" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div id="radialTracks" class="radial-tracks"></div>

            <div class="radial-center">
                <div class="center-sigil">
                    <img src="ienchlogo.jpg" alt="iENCH">
                </div>
                <div id="playerTitle" class="player-title">LOADING ARCHIVE</div>
                <div class="player-subtitle">SIGNAL RESTORED // NODE 004</div>

                <div class="radial-controls">
                    <button id="previousButton" class="control-button" title="Previous">◀◀</button>
                    <button id="playButton" class="control-button play-button" title="Play">▶</button>
                    <button id="nextButton" class="control-button" title="Next">▶▶</button>
                </div>

                <div id="audioProgress" class="audio-progress">
                    <div id="audioProgressFill" class="audio-progress-fill"></div>
                </div>
                <div class="time">
                    <span id="currentTime">00:00</span>
                    <span id="duration">00:00</span>
                </div>
            </div>

            <div id="errorMessage" class="error"></div>
            <div class="player-info">iENCH // ARCHIVES NODE 004 // ORIGIN UNKNOWN</div>
        </div>
    </div>
</section>

<audio id="audio" preload="metadata"></audio>

<script>
/* =========================================================
   INTRO
========================================================= */
const progressFill = document.getElementById("progressFill");
const percent = document.getElementById("percent");
const status = document.getElementById("status");
const info = document.getElementById("info");
const intro = document.getElementById("intro");
const archive = document.getElementById("archive");

const stages = [
    {at:0,  status:"INITIALIZING",      info:"SEARCHING FOR SIGNAL"},
    {at:10, status:"SCANNING",          info:"NOISE DETECTED"},
    {at:22, status:"SIGNAL FOUND",     info:"UNKNOWN SOURCE"},
    {at:35, status:"CONNECTING",        info:"NODE 004"},
    {at:48, status:"RECONSTRUCTING",    info:"FRAGMENT 01 FOUND"},
    {at:61, status:"DECODING",          info:"LANGUAGE UNKNOWN"},
    {at:74, status:"RESTORING",         info:"MEMORY STRUCTURE STABLE"},
    {at:87, status:"VERIFYING SIGNAL",  info:"INTEGRITY 92.4%"},
    {at:100,status:"SIGNAL RESTORED",   info:"ARCHIVE AVAILABLE"}
];

let progress = 0;

function updateSequence(){
    progress += Math.random() * 1.4 + 0.4;
    if(progress > 100) progress = 100;

    progressFill.style.width = progress + "%";
    percent.textContent = Math.floor(progress) + "%";

    let currentStage = stages[0];
    for(const stage of stages){
        if(progress >= stage.at) currentStage = stage;
    }

    status.textContent = currentStage.status;
    info.textContent = currentStage.info;

    if(progress >= 100){
        setTimeout(() => {
            intro.classList.add("hide");

            setTimeout(() => {
                archive.classList.add("show");
                document.body.style.overflow = "auto";
                initializeArchive();
            }, 1800);
        }, 1000);
        return;
    }

    setTimeout(updateSequence, 70 + Math.random() * 110);
}

setTimeout(updateSequence, 1500);


/* =========================================================
   PLAYER
   IMPORTANT:
   Les MP3 peuvent être à la racine OU dans /audio/.
   Le code essaie d'abord audio/NOM.mp3, puis NOM.mp3.
   Ainsi le lecteur fonctionne maintenant et continuera
   à fonctionner lorsque tu déplaceras les MP3 dans /audio/.
========================================================= */

const audio = document.getElementById("audio");
const playButton = document.getElementById("playButton");
const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");
const audioProgress = document.getElementById("audioProgress");
const audioProgressFill = document.getElementById("audioProgressFill");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");
const playerTitle = document.getElementById("playerTitle");
const trackList = document.getElementById("trackList");
const errorMessage = document.getElementById("errorMessage");

let tracks = [];
let currentTrack = 0;
let currentPath = "";
let initialized = false;


/* =========================================================
   LISTE DES TITRES
   On récupère automatiquement les MP3 du dépôt GitHub.
   Cela évite d'avoir à réécrire le code chaque fois que
   tu ajoutes un nouveau morceau.
========================================================= */

async function getRepositoryAudioFiles(){

    const base =
        "https://api.github.com/repos/iENCH-hub/iENCH-SIGNAL-RESTORED/contents/";

    async function getFolder(path){
        const response = await fetch(base + path, {
            headers: { "Accept": "application/vnd.github+json" }
        });

        if(!response.ok) return [];

        const files = await response.json();

        return files
            .filter(item =>
                item.type === "file" &&
                /\.mp3$/i.test(item.name)
            )
            .map(item => item.name);
    }

    try{
        /*
           On regarde les deux emplacements :
           1. la racine du dépôt
           2. le dossier /audio/

           Ainsi tu peux laisser tes MP3 actuels à la racine,
           puis les déplacer dans /audio/ sans refaire le code.
        */
        const [rootFiles, audioFiles] = await Promise.all([
            getFolder(""),
            getFolder("audio")
        ]);

        return [...new Set([...audioFiles, ...rootFiles])];

    }catch(error){
        console.error(error);
        return [];
    }
}


/* =========================================================
   NOM AFFICHÉ
========================================================= */
function displayTitle(filename){

    return filename
        .replace(/\.mp3$/i, "")
        .replace(/_iENCH$/i, "")
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .toUpperCase();
}


/* =========================================================
   CRÉATION DES TRACKS
========================================================= */
async function loadTracks(){

    errorMessage.textContent = "SCANNING AUDIO ARCHIVE...";

    const filenames = await getRepositoryAudioFiles();

    if(!filenames.length){
        errorMessage.textContent =
            "NO MP3 FOUND // CHECK THE GITHUB AUDIO FILES";
        playerTitle.textContent = "ARCHIVE EMPTY";
        return;
    }

    /*
       IMPORTANT :
       Le chemin principal est maintenant :
       audio/NOM EXACT DU FICHIER.mp3

       Si le MP3 est encore à la racine de GitHub,
       le lecteur essaiera automatiquement NOM.mp3.
    */
    tracks = filenames.map(filename => ({
        title: displayTitle(filename),
        filename: filename,
        file: "audio/" + encodeURIComponent(filename),
        fallback: encodeURIComponent(filename)
    }));

    /*
       On place OMEN NOMENSEYA TOLL en premier si présent.
    */
    const omenIndex = tracks.findIndex(track =>
        track.title.includes("OMEN NOMENSEYA TOLL")
    );

    if(omenIndex > 0){
        const omen = tracks.splice(omenIndex, 1)[0];
        tracks.unshift(omen);
    }

    errorMessage.textContent = "";
    currentTrack = 0;

    createRadialTrackList();
    loadTrack(0);
}


/* =========================================================
   RADIAL TRACK WHEEL
========================================================= */
const radialTracks = document.getElementById("radialTracks");
const radialNetwork = document.getElementById("radialNetwork");
const radialPlayer = document.getElementById("radialPlayer");

const tribalGlyphs = ["◈","⌁","ϟ","◌","ᛝ","⋔","ᚫ","⊹","◉","⌖","∿","✧","𐌗","⟟","◍","⌁"];

function createRadialTrackList(){
    if(!radialTracks) return;

    radialTracks.innerHTML = "";
    if(radialNetwork) radialNetwork.innerHTML = "";
    if(!tracks.length) return;

    const count = tracks.length;
    const cx = 500, cy = 500;
    const baseRadius = count <= 10 ? 380 : count <= 14 ? 405 : 425;

    tracks.forEach((track,index)=>{
        const angle = (index/count)*Math.PI*2 - Math.PI/2
            + Math.sin(index*2.37)*Math.PI/180*5;
        const radius = baseRadius + Math.sin(index*1.71)*16;

        const x = 50 + Math.cos(angle)*(radius/10);
        const y = 50 + Math.sin(angle)*(radius/10);

        const nodeX = cx + Math.cos(angle)*300;
        const nodeY = cy + Math.sin(angle)*300;

        if(radialNetwork){
            const line = document.createElementNS("http://www.w3.org/2000/svg","line");
            line.dataset.index = index;
            line.setAttribute("x1",cx);
            line.setAttribute("y1",cy);
            line.setAttribute("x2",nodeX);
            line.setAttribute("y2",nodeY);
            radialNetwork.appendChild(line);

            const node = document.createElementNS("http://www.w3.org/2000/svg","circle");
            node.dataset.index = index;
            node.setAttribute("cx",nodeX);
            node.setAttribute("cy",nodeY);
            node.setAttribute("r","5.5");
            radialNetwork.appendChild(node);
        }

        const element = document.createElement("div");
        element.className = "radial-track";
        element.dataset.index = index;
        element.style.left = x + "%";
        element.style.top = y + "%";

        element.innerHTML = `
            <div class="radial-track-number">${String(index+1).padStart(2,"0")}</div>
            <span class="radial-track-glyph">${tribalGlyphs[index % tribalGlyphs.length]}</span>
            <div class="radial-track-name">${escapeHtml(track.title)}</div>
        `;

        element.addEventListener("click",()=>{
            loadTrack(index);
            playAudio();
        });

        radialTracks.appendChild(element);
    });

    updateRadialTrackStates();
}

function updateRadialTrackStates(){
    document.querySelectorAll(".radial-track").forEach((el,index)=>{
        el.classList.toggle("active",index === currentTrack);
    });

    if(radialNetwork){
        radialNetwork.querySelectorAll("line").forEach((el,index)=>{
            el.classList.toggle("active-line",index === currentTrack);
        });
        radialNetwork.querySelectorAll("circle").forEach((el,index)=>{
            el.classList.toggle("active-node",index === currentTrack);
        });
    }
}

/* =========================================================
   SÉCURITÉ TEXTE
========================================================= */
function escapeHtml(text){

    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}


/* =========================================================
   CHARGER UN TITRE
========================================================= */
function loadTrack(index){

    if(index < 0 || index >= tracks.length) return;

    currentTrack = index;
    currentPath = tracks[index].file;

    audio.pause();
    audio.currentTime = 0;

    playerTitle.textContent = tracks[index].title;

    audioProgressFill.style.width = "0%";
    currentTime.textContent = "00:00";
    duration.textContent = "00:00";

    /*
       On commence obligatoirement par /audio/.
    */
    audio.src = currentPath;
    audio.load();

    updateTrackList();
}


/* =========================================================
   SI LE FICHIER N'EST PAS ENCORE DANS /audio/
   on essaie automatiquement le fichier à la racine.
========================================================= */
audio.addEventListener("error", function(){

    if(!tracks.length) return;

    const track = tracks[currentTrack];

    if(audio.src.includes("/audio/")){
        console.warn(
            "Fichier absent de /audio/, essai à la racine :",
            track.filename
        );

        audio.src = track.fallback;
        audio.load();
        return;
    }

    errorMessage.textContent =
        "UNABLE TO READ // " + track.filename;
});


/* =========================================================
   PLAY
========================================================= */
function playAudio(){

    if(!tracks.length) return;

    audio.play()
        .then(() => {
            playButton.textContent = "❚❚";
            radialPlayer?.classList.add("is-playing");
        })
        .catch(error => {
            console.error("Audio playback error:", error);
            errorMessage.textContent =
                "PLAYBACK ERROR // " + tracks[currentTrack].filename;
        });
}


/* =========================================================
   PAUSE
========================================================= */
function pauseAudio(){

    audio.pause();
    playButton.textContent = "▶";
    radialPlayer?.classList.remove("is-playing");
}


/* =========================================================
   PLAY BUTTON
========================================================= */
playButton.addEventListener("click", () => {

    if(audio.paused){
        playAudio();
    }else{
        pauseAudio();
    }

});


/* =========================================================
   PREVIOUS
========================================================= */
previousButton.addEventListener("click", () => {

    if(!tracks.length) return;

    if(audio.currentTime > 3){
        audio.currentTime = 0;
        return;
    }

    currentTrack--;

    if(currentTrack < 0){
        currentTrack = tracks.length - 1;
    }

    loadTrack(currentTrack);
    playAudio();

});


/* =========================================================
   NEXT
========================================================= */
nextButton.addEventListener("click", () => {

    if(!tracks.length) return;

    currentTrack++;

    if(currentTrack >= tracks.length){
        currentTrack = 0;
    }

    loadTrack(currentTrack);
    playAudio();

});


/* =========================================================
   TITRE SUIVANT AUTOMATIQUE
========================================================= */
audio.addEventListener("ended", () => {

    if(!tracks.length) return;

    currentTrack++;

    if(currentTrack >= tracks.length){
        currentTrack = 0;
    }

    loadTrack(currentTrack);
    playAudio();

});


/* =========================================================
   PROGRESSION
========================================================= */
audio.addEventListener("timeupdate", () => {

    if(!audio.duration || !isFinite(audio.duration)) return;

    const percentage =
        (audio.currentTime / audio.duration) * 100;

    audioProgressFill.style.width = percentage + "%";
    currentTime.textContent = formatTime(audio.currentTime);

});


/* =========================================================
   DURÉE
========================================================= */
audio.addEventListener("loadedmetadata", () => {

    if(isFinite(audio.duration)){
        duration.textContent = formatTime(audio.duration);
    }

});


/* =========================================================
   BARRE DE PROGRESSION
========================================================= */
audioProgress.addEventListener("click", event => {

    if(!audio.duration || !isFinite(audio.duration)) return;

    const rect = audioProgress.getBoundingClientRect();

    const clickPosition =
        event.clientX - rect.left;

    const percentage =
        Math.max(0, Math.min(1, clickPosition / rect.width));

    audio.currentTime =
        percentage * audio.duration;

});


/* =========================================================
   FORMAT TEMPS
========================================================= */
function formatTime(seconds){

    if(isNaN(seconds) || !isFinite(seconds)){
        return "00:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );

}


/* =========================================================
   MISE À JOUR PLAYLIST
========================================================= */
function updateTrackList(){ updateRadialTrackStates(); }


/* =========================================================
   ÉTRANGE DIAPORAMA // ARCHIVE VISUELLE
   Les images sont récupérées automatiquement depuis GitHub.
   Le lecteur reste au-dessus, lisible et stable.
========================================================= */
const slideshow = document.getElementById("archiveSlideshow");
const slideElements = slideshow ? Array.from(slideshow.querySelectorAll(".slide-photo")) : [];
let slideshowImages = [];
let slideshowTimer = null;
let slideshowIndex = 0;

async function getRepositoryImageFiles(){
    const base = "https://api.github.com/repos/iENCH-hub/iENCH-SIGNAL-RESTORED/contents/";

    async function getFolder(path){
        try{
            const response = await fetch(base + path, {
                headers:{"Accept":"application/vnd.github+json"}
            });
            if(!response.ok) return [];
            const files = await response.json();
            return files
                .filter(item => item.type === "file" && /\.(jpg|jpeg|png|webp|gif)$/i.test(item.name))
                .map(item => ({name:item.name, path:item.path}));
        }catch(e){
            return [];
        }
    }

    const [root, images] = await Promise.all([
        getFolder(""),
        getFolder("images")
    ]);

    const all = [...root, ...images];
    const unique = [];
    const seen = new Set();

    for(const item of all){
        /* Le logo reste réservé au logo animé, pas au diaporama. */
        if(item.name.toLowerCase() === "ienchlogo.jpg") continue;
        if(seen.has(item.path)) continue;
        seen.add(item.path);
        unique.push(item);
    }

    return unique;
}

function shuffleArray(array){
    const copy = [...array];
    for(let i=copy.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
}

function startSlideshow(){
    if(!slideElements.length || !slideshowImages.length) return;

    slideshowImages = shuffleArray(slideshowImages);

    /* Plusieurs images restent simultanément visibles. */
    slideElements.forEach((img,index)=>{
        const item = slideshowImages[index % slideshowImages.length];
        img.src = "https://raw.githubusercontent.com/iENCH-hub/iENCH-SIGNAL-RESTORED/main/" +
            item.path.split("/").map(encodeURIComponent).join("/");
        img.classList.remove("visible");
        setTimeout(()=>img.classList.add("visible"), 100 + index*240);
    });

    slideshowIndex = slideElements.length % slideshowImages.length;

    clearInterval(slideshowTimer);
    slideshowTimer = setInterval(()=>{
        const slot = Math.floor(Math.random()*slideElements.length);
        const img = slideElements[slot];
        const item = slideshowImages[slideshowIndex % slideshowImages.length];
        slideshowIndex++;

        img.classList.remove("visible");

        setTimeout(()=>{
            img.src = "https://raw.githubusercontent.com/iENCH-hub/iENCH-SIGNAL-RESTORED/main/" +
                item.path.split("/").map(encodeURIComponent).join("/");
            requestAnimationFrame(()=>img.classList.add("visible"));
        }, 1200);
    }, 3800);
}

async function initializeSlideshow(){
    slideshowImages = await getRepositoryImageFiles();
    if(slideshowImages.length) startSlideshow();
}

/* =========================================================
   INITIALISATION
========================================================= */
async function initializeArchive(){

    if(initialized) return;

    initialized = true;

    await loadTracks();
    initializeSlideshow();

}
</script>
